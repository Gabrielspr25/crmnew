  *{box-sizing:border-box;margin:0;padding:0;} a{color:inherit;text-decoration:none;}

  .cli{display:flex;align-items:center;gap:11px;}
  .pill{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;}

  .flowgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;}

  .flowhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;}

  .flowcount{margin-left:auto;color:var(--txt3);font-size:11px;font-weight:700;}

  .stepchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:7px;}

  .clines{display:none;padding:2px 16px 12px;flex-direction:column;gap:8px;} .ccard.open .clines{display:flex;}

  .subscriber-plan{color:var(--txt2);font-size:14px;font-weight:650;}
  .subscriber-equipment{color:var(--txt3);font-size:12px;}
  .subscriber-price{color:var(--green);font-size:14px;font-weight:700;white-space:nowrap;}
  .subscriber-expiry{color:var(--txt3);font-size:12px;white-space:nowrap;}
  .subscriber-meta{color:var(--txt3);font-size:12px;margin-top:5px;line-height:1.35;}

  .cinp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--txt);text-align:right;}
  .qty{display:inline-block;min-width:28px;padding:2px 9px;border-radius:6px;background:var(--green-soft);color:var(--green);font-weight:700;border:1px solid var(--green-border);}
  .grow{cursor:pointer;} .grow:hover{background:var(--card2);} .grow .ar{color:var(--txt3);font-size:11px;}
  td.c,th.c{text-align:center;} td.r,th.r{text-align:right;}
  .lrow td{background:var(--card2);}
  .kpi.click{cursor:pointer;transition:border-color .15s,box-shadow .15s;} .kpi.click:hover{border-color:var(--primary);}

  .kpi .bk{font-size:11.5px;color:var(--txt2);margin-top:7px;line-height:1.65;}
  .kpi .v .tot{font-size:11px;font-weight:500;color:var(--txt3);margin-left:6px;}
  .search{max-width:340px;}
  .acell{display:flex;flex-direction:column;gap:5px;align-items:stretch;}
  .astep{display:flex;justify-content:space-between;align-items:center;gap:4px;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12px;color:var(--txt2);cursor:pointer;}

  .asubs{font-size:11px;color:var(--txt3);}
  .asana-table{min-width:1600px;table-layout:fixed;}

  .asana-table td{padding:12px 10px;vertical-align:middle;}
  .asana-client-col{width:260px;}.asana-vendor-col{width:130px;}.asana-product-col{width:125px;}.asana-lines-col{width:85px;}.asana-money-col{width:95px;}.asana-notes-col{width:90px;}.asana-actions-col{width:120px;}
  .asana-table .cinp{width:78px!important;padding:7px 8px;font-size:13px;}
  .asana-client-cell .linkbtn{font-size:14px;line-height:1.25;}
  .asana-ban{font-size:12.5px;color:var(--txt2);margin-top:4px;line-height:1.3;}
  .asana-client-meta{font-size:11.5px;color:var(--txt3);margin-top:3px;line-height:1.3;}
  .asana-table .pill{font-size:11.5px;}
  .asana-notes-btn,.asana-actions .btn{font-size:12px!important;line-height:1.2;}
  .asana-actions{display:flex;flex-direction:column;gap:6px;}
  .asana-table th:nth-child(1),.asana-table td:nth-child(1){width:260px;}
  .asana-table th:nth-child(2),.asana-table td:nth-child(2){width:130px;}
  .asana-table th:nth-child(n+3):nth-child(-n+9),.asana-table td:nth-child(n+3):nth-child(-n+9){width:125px;}
  .asana-table th:nth-child(10),.asana-table td:nth-child(10){width:85px;}
  .asana-table th:nth-child(11),.asana-table td:nth-child(11){width:95px;}
  .asana-table th:nth-child(12),.asana-table td:nth-child(12){width:90px;}

  @media(max-width:720px){.logbox{grid-template-columns:1fr;}.logbox .btn{width:100%;}}
</style>

const API=''; // mismo origen: funciona en localhost:4000 y en el servidor (sin hardcodear host)
let token=null, currentUser=null;
const $=(id)=>document.getElementById(id);
function tog(){const b=document.body,d=b.getAttribute('data-theme')==='day';b.setAttribute('data-theme',d?'dark':'day');$('tgt').textContent=d?'Modo día':'Modo noche';}
function money(n){return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function ini(n){return (n||'?').trim().slice(0,2).toUpperCase();}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function api(p,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+token};if(opts.body&&typeof opts.body!=='string'){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body);}const r=await fetch(API+p,opts);if(r.status===401){clearSession();showLogin('Tu sesión venció, entrá de nuevo');throw new Error('401');}if(!r.ok&&r.status!==409){let msg='';try{const d=await r.json();msg=d&&d.error?': '+d.error:'';}catch(e){}throw new Error(p+' -> '+r.status+msg);}return r.json();}
async function apiForm(p,formData){const r=await fetch(API+p,{method:'POST',headers:{Authorization:'Bearer '+token},body:formData});if(r.status===401){clearSession();showLogin('Tu sesión venció, entrá de nuevo');throw new Error('401');}return r.json();}
function monthStart(){const m=new Date();return m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-01';}

let cliTab='active', cliQ='', cliPage=1, cliServiceFilter='todas', cliRenewalFilter='';
const CLI_TABS=[['active','Activos'],['cancelled','Cancelados'],['following','Seguimiento'],['incomplete','Incompletos']];
const CLI_PILL={active:'green',cancelled:'red',following:'violet',incomplete:'amber'};
async function reClientes(){ $('view').innerHTML=await viewClientes(); }
function setCliTab(t){ cliTab=t; cliRenewalFilter=''; if(t!=='active')cliServiceFilter='todas'; cliPage=1; reClientes(); }
function setCliServiceFilter(t){ cliServiceFilter=t; cliRenewalFilter=''; cliPage=1; reClientes(); }
function setCliRenewalFilter(t){ cliTab='active'; cliServiceFilter='todas'; cliRenewalFilter=t; cliPage=1; reClientes(); }
function cliSearch(ev){ if(ev.key==='Enter'){ cliQ=ev.target.value.trim(); cliPage=1; reClientes(); } }
function cliSearchNow(v){ cliQ=String(v||'').trim(); cliPage=1; reClientes(); }
function cliPageGo(d){ cliPage+=d; reClientes(); }
function cliClientServiceType(client){
  const types=[client&&client.all_service_types,client&&client.primary_service_type].filter(Boolean).join(' ').toLowerCase();
  const movil=/movil|móvil|mobile/.test(types);
  const fijo=/fijo|fixed/.test(types);
  if(movil&&fijo)return 'convergente';
  if(movil)return 'movil';
  if(fijo)return 'fijo';
  return 'sin_clasificar';
}
function fmtDate(d){ if(!d) return '—'; const x=new Date(d); if(isNaN(x)) return '—'; return x.toLocaleDateString('es-PR',{day:'numeric',month:'numeric',year:'numeric'}); }
function vencBadge(d){ if(!d) return ''; const days=Math.floor((new Date(d)-new Date())/86400000); if(isNaN(days)) return ''; if(days<0) return `<div class="pill red" style="margin-top:3px;font-size:10px">Vencido hace ${-days} días</div>`; if(days<=60) return `<div class="pill amber" style="margin-top:3px;font-size:10px">Vence en ${days} días</div>`; return ''; }

async function viewClientes(){
  const service=cliTab==='active'?cliServiceFilter:'todas';
  const d=await api(`/api/clients-real?tab=${cliTab}&q=${encodeURIComponent(cliQ)}&service=${service}&renewal=${cliRenewalFilter}`);
  const st=d.stats||{}, lm=st.line_metrics||{};
  const counts={active:st.active_count,cancelled:st.cancelled_count,following:st.following_count,incomplete:st.incomplete_count};
  const amount=v=>Number(v)>0?money(v):'';
  const metric=(label,value,monthly)=>`<div style="display:flex;justify-content:space-between;gap:10px"><span>${label} <b>${value||0}</b></span>${monthly?`<span style="color:var(--green)">${monthly}</span>`:''}</div>`;
  const active=lm.active||{}, cancelled=lm.cancelled||{}, following=lm.following||{}, incomplete=lm.incomplete||{};
  const cards=[
    ['active','Activas',active.active_lines_count||0,'Líneas activas',[
      metric('Móvil',active.mobile_lines,amount(active.mobile_monthly_value)),
      metric('Fijo',active.fixed_lines,amount(active.fixed_monthly_value)),
      metric('Sin clasificar',active.incomplete_lines),
      active.suspended_lines?`Suspendidas: <b>${active.suspended_lines}</b> incluidas arriba`:''
    ]],
    ['cancelled','Canceladas',st.cancelled_lines_count||0,'Líneas canceladas',[
      `Clientes con cartera cancelada: <b>${counts.cancelled??0}</b>`,
      'Sin precios ni clasificación comercial en este resumen.'
    ]],
    ['following','Seguimiento',counts.following??0,'Clientes en seguimiento',[
      metric('Líneas activas',following.active_lines_count),
      metric('Móvil',following.mobile_lines,amount(following.mobile_monthly_value)),
      metric('Fijo',following.fixed_lines,amount(following.fixed_monthly_value))
    ]],
    ['incomplete','Incompletas',counts.incomplete??0,'Clientes para completar',[
      metric('Líneas activas',incomplete.active_lines_count),
      metric('Móvil',incomplete.mobile_lines),
      metric('Fijo',incomplete.fixed_lines),
      metric('Sin clasificar',incomplete.incomplete_lines)
    ]]
  ];
  const card=([t,label,total,totalLabel,details])=>`<div class="kpi click${cliTab===t?' on':''}" onclick="setCliTab('${t}')">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="l">${label}</span><span class="pill ${CLI_PILL[t]}">${totalLabel}</span></div>
    <div class="v">${Number(total||0).toLocaleString('en-US')}</div>
    <div class="bk">${details.filter(Boolean).join('')}</div></div>`;
  const listed=d.clients||[];
  const all=listed;
  const serviceCounts=st.service_counts||{};
  const serviceTabs=[
    ['todas','Todas'],['movil','Móvil'],['fijo','Fijo'],['convergente','Convergente']
  ].map(([value,label])=>`<button class="btn ${cliServiceFilter===value?'':'ghost'}" data-client-service-tab="${value}" style="padding:8px 13px;font-size:13px" onclick="setCliServiceFilter('${value}')">${label} <b>${serviceCounts[value]??0}</b></button>`).join('');
  const renewal=st.renewal_alert||{};
  const renewalTabs=[
    ['','Todo el pool'],['expired','Vencidas'],['upcoming','Próximos 30 días'],['missing','Sin fecha']
  ].map(([value,label])=>`<button class="btn ${cliRenewalFilter===value?'':'ghost'}" style="padding:5px 9px;font-size:11px" onclick="setCliRenewalFilter('${value}')">${label}${value?` <b>${renewal[value+'_clients']??0}</b>`:''}</button>`).join('');
  const per=50, pages=Math.max(1,Math.ceil(all.length/per)); if(cliPage>pages)cliPage=pages; const from=(cliPage-1)*per, rows=all.slice(from,from+per);
  const tr=c=>{ const bans=(c.ban_numbers||'').split(', ').filter(Boolean); const banShow=bans.length?bans[0]+(bans.length>1?` <span style="color:var(--txt3)">(+${bans.length-1})</span>`:''):'—'; const subN=Number(c.subscriber_count||0); const sub=c.primary_subscriber_phone?(c.primary_subscriber_phone+(subN>1?` <span style="color:var(--txt3)">(+${subN-1})</span>`:'')):'—'; const act=Number(c.active_ban_count||0)>0; const nombre=c.name?`<b>${c.name}</b>`:'<b style="color:var(--txt3)">sin nombre</b>'; return `<tr class="click" onclick="abrirCliente('${c.id}')">
    <td><div class="cli"><span class="av">${ini(c.name||'?')}</span>${nombre}</div></td>
    <td>${c.phone||c.mobile||c.cellular||'—'}</td>
    <td style="color:var(--txt2)">${fmtDate(c.primary_sale_date)}</td>
    <td>${c.primary_service_type||'—'}</td>
    <td><span class="pill" style="background:var(--card2);color:var(--txt2)">${c.base||'BD propia'}</span></td>
    <td><span class="pill ${act?'green':'red'}">${act?'Activo':'Cancelado'}</span></td>
    <td>${c.vendor_name||'<span style="color:var(--txt3)">Sin asignar</span>'}</td>
    <td>${banShow}</td>
    <td>${sub}</td>
    <td>${fmtDate(c.primary_contract_end_date)}${vencBadge(c.primary_contract_end_date)}</td>
    <td style="text-align:center;color:var(--primary)">→</td></tr>`; };
  return `<div class="head"><div><h1>Clientes</h1><div class="s">Información de todos los clientes · data REAL de crm_pro</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button class="btn ghost" onclick="mostrarInfoReportes()">📊 Reportes</button>
      <button class="btn ghost" onclick="exportarBaseCompleta()">⬇ Exportar BD</button>
      <button class="btn" onclick="nuevoCliente()">+ Nuevo cliente</button>
    </div></div>
  <div class="kpis">${cards.map(card).join('')}</div>
  ${cliTab==='active'?`<div class="card" style="padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><b style="font-size:12px">Renovaciones hoy</b><span class="s" style="margin-left:8px;font-size:11px">Se actualiza con las fechas reales de contrato.</span></div><div style="display:flex;gap:6px;flex-wrap:wrap">${renewalTabs}</div></div>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px"><span class="s" style="font-size:12px;margin-right:2px">Clientes activos por servicio:</span>${serviceTabs}</div>`:''}
  <div style="margin-bottom:12px"><input class="inp search" placeholder="🔍 Buscar cliente por empresa, BAN, contacto, teléfono o email" value="${cliQ}" oninput="cliSearchNow(this.value)" onkeydown="cliSearch(event)"></div>
  <div class="s" style="margin-bottom:8px;display:flex;align-items:center;gap:10px">Mostrando ${all.length?from+1:0}-${Math.min(from+per,all.length)} de ${all.length} · pág ${cliPage}/${pages}
    <button class="btn ghost" style="padding:4px 10px" onclick="${cliPage>1?'cliPageGo(-1)':''}">Anterior</button>
    <button class="btn ghost" style="padding:4px 10px" onclick="${cliPage<pages?'cliPageGo(1)':''}">Siguiente</button></div>
  <div class="card" style="overflow-x:auto"><table style="min-width:1200px"><thead><tr>
    <th>Empresa</th><th>Tel. contacto</th><th>Inicio venta</th><th>Tipo BAN</th><th>Base</th><th>Estado</th><th>Vendedor</th><th>Num BAN</th><th>Suscriptor</th><th>Fecha vencimiento</th><th></th>
  </tr></thead><tbody>${rows.map(tr).join('')||'<tr><td colspan="11" class="empty">Sin clientes en este filtro</td></tr>'}</tbody></table></div>`;
}

let dirQ='', dirDistrict='', dirContacts=[];
const DIR_FIELDS=[
  ['district','Distrito'], ['code','Codigo'], ['full_name','Nombre'], ['employee_number','# Empleado'],
  ['job_title','Puesto'], ['municipalities','Pueblos que comprende'], ['mobile','Celular'], ['email','Email'],
];
async function reDirectorioOperaciones(){ $('view').innerHTML=await viewDirectorioOperaciones(); }
function dirSearch(value){ dirQ=String(value||'').trim(); reDirectorioOperaciones(); }
function dirSetDistrict(value){ dirDistrict=value; reDirectorioOperaciones(); }
function dirCanEdit(){ return ['admin','supervisor'].includes(String(currentUser&&currentUser.rol||'').toLowerCase()); }
function dirEsc(value){ return esc(value||'—'); }
function dirEdit(id){
  const contact=dirContacts.find((item)=>String(item.id)===String(id));
  if(!contact) return;
  openForm('Editar contacto',DIR_FIELDS.map(([key,label])=>({key,label,value:contact[key]||''})),async(values)=>{
    await api('/api/directorio-operaciones/'+id,{method:'PUT',body:values});
    reDirectorioOperaciones();
  });
}
async function dirImportFile(input){
  const file=input&&input.files&&input.files[0];
  if(!file) return;
  const form=new FormData(); form.append('file',file);
  try{
    const response=await fetch(API+'/api/directorio-operaciones/import',{method:'POST',headers:{Authorization:'Bearer '+token},body:form});
    const result=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(result.error||'No se pudo actualizar el directorio');
    alert('Directorio actualizado:\n'+result.total+' contactos leidos\n'+result.inserted+' nuevos\n'+result.updated+' actualizados\n'+result.unchanged+' sin cambios'+(result.ignored&&result.ignored.length?'\n'+result.ignored.length+' filas ignoradas por faltar nombre o empleado':''));
    reDirectorioOperaciones();
  }catch(error){ alert('No se pudo actualizar: '+error.message); }
  finally{ input.value=''; }
}
async function viewDirectorioOperaciones(){
  const params=new URLSearchParams(); if(dirQ)params.set('q',dirQ); if(dirDistrict)params.set('district',dirDistrict);
  const data=await api('/api/directorio-operaciones?'+params.toString());
  dirContacts=data.contacts||[];
  const districts=data.districts||[];
  const options=['<option value="">Todos los distritos</option>'].concat(districts.map((item)=>'<option value="'+esc(item.district)+'"'+(item.district===dirDistrict?' selected':'')+'>'+esc(item.district)+' ('+item.contacts+')</option>')).join('');
  const rows=dirContacts.map((contact)=>'<tr>'
    +'<td><b>'+dirEsc(contact.full_name)+'</b><div class="s" style="font-size:11px;margin-top:2px"># '+dirEsc(contact.employee_number)+'</div></td>'
    +'<td>'+dirEsc(contact.district)+'</td><td>'+dirEsc(contact.job_title)+'</td><td>'+dirEsc(contact.municipalities)+'</td>'
    +'<td>'+dirEsc(contact.mobile)+'</td><td>'+dirEsc(contact.email)+'</td>'
    +(dirCanEdit()?'<td style="text-align:right"><button class="btn ghost" style="padding:5px 10px;font-size:11px" onclick="dirEdit(\''+contact.id+'\')">Editar</button></td>':'')
    +'</tr>').join('');
  return '<div class="head"><div><h1>Directorio Operaciones</h1><div class="s">Contactos operacionales de Clientes Masivos. Tabla independiente del CRM comercial.</div></div>'
    +(dirCanEdit()?'<div><input id="dirFile" type="file" accept=".xlsx,.xls" style="display:none" onchange="dirImportFile(this)"><button class="btn" onclick="$(\'dirFile\').click()">Actualizar desde Excel</button></div>':'')+'</div>'
    +'<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><span class="pill violet">'+(data.total||0)+' contactos</span>'
    +'<select class="inp" style="width:250px" onchange="dirSetDistrict(this.value)">'+options+'</select>'
    +'<input class="inp search" placeholder="Buscar nombre, empleado, email o pueblo" value="'+esc(dirQ)+'" oninput="dirSearch(this.value)"></div>'
    +'<div class="card" style="overflow-x:auto"><table style="min-width:960px"><thead><tr><th>Contacto</th><th>Distrito</th><th>Puesto</th><th>Pueblos</th><th>Celular</th><th>Email</th>'+(dirCanEdit()?'<th></th>':'')+'</tr></thead><tbody>'
    +(rows||'<tr><td colspan="7" class="empty">Sin contactos para este filtro.</td></tr>')+'</tbody></table></div>';
}

let cliM=null, cliMTab='info', cliMSub='activas', cliMLineTab='todas';
const CLI_TABS_M=[['info','Información del Cliente'],['bans','BANs y Suscriptores'],['hist','Historial de Gestiones'],['comp','Comparativas'],['ventas','Ventas']];
function cliAct(s){return ['a','activo','active','activa','s','suspendido','suspended'].includes(String(s||'').toLowerCase());}
function cliCanc(s){const x=String(s||'').toLowerCase();return x.includes('cancel')||x==='c'||x==='inactivo'||x==='inactive';}
function cliLineKind(subscriber){
  const kind=String(subscriber&&subscriber.line_kind||'').toLowerCase();
  if(kind.includes('movil')||kind.includes('móvil')||kind.includes('mobile'))return 'movil';
  if(kind.includes('fijo')||kind.includes('fixed'))return 'fijo';
  const productType=String(subscriber&&subscriber.product_type||'').toUpperCase();
  if(productType==='G')return 'movil';
  if(['O','T','V'].includes(productType))return 'fijo';
  return 'sin_clasificar';
}
function cliServiceProfile(subscribers,bans=[]){
  const active=(subscribers||[]).filter(s=>cliAct(s.status));
  const movil=active.filter(s=>cliLineKind(s)==='movil');
  const fijo=active.filter(s=>cliLineKind(s)==='fijo');
  return {movil,fijo,convergente:!!(movil.length&&fijo.length)};
}
function cliProfileLabel(profile){
  if(profile.convergente)return '<span class="pill violet">Convergente</span>';
  if(profile.movil.length)return '<span class="pill green">Móvil</span>';
  if(profile.fijo.length)return '<span class="pill amber">Fijo</span>';
  return '<span class="pill" style="background:var(--card2);color:var(--txt3)">Sin clasificar</span>';
}
function cliLineMonthly(value){return value===null||value===undefined||String(value).trim()===''?'—':money(value);}
function cliNoren(s){var x=String(s||'').toLowerCase();return x.includes('no_renueva')||x==='suspendido';}
function cliVenc(d){if(!d)return 'Sin fecha';const days=Math.floor((new Date(d)-new Date())/86400000);if(isNaN(days))return 'Sin fecha';return days<0?('Vencido hace '+(-days)+'d'):('Vence en '+days+'d');}
function cliContractEndFromPayments(v){var n=parseInt(String(v||'').replace(/\D/g,''),10);if(!isFinite(n)||n<=0)return '';var d=new Date();d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10);}

    {key:'phone',label:'Telefono / suscriptor (10 digitos)',ph:'7875551234',value:s.phone||''},

    {key:'line_type',label:'Tipo de linea',type:'select',options:[['','-'],['NEW','NEW'],['REN','REN'],['LINEA_NUEVA','Linea nueva'],['RENOVACION','Renovacion'],['PORTABILIDAD','Portabilidad']],value:s.line_type||''},
    {key:'product_type',label:'PRODUCT_TYPE',value:s.product_type||''},
    {key:'equipment',label:'Modelo equipo (si es movil)',value:s.equipment||''},
    {key:'activation_date',label:'Fecha activacion',value:s.activation_date?String(s.activation_date).slice(0,10):''},

    {key:'status',label:'Estado',type:'select',options:[['activo','Activo'],['cancelado','Cancelado'],['suspendido','Suspendido / No renueva']],value:s.status||'activo'},

  ];

function cliNormalizeSubscriberPayload(v){
  v=Object.assign({},v||{});
  if(!v.remaining_payments && v.contract_term && v.payments_made){
    var total=parseInt(String(v.contract_term).replace(/\D/g,''),10), paid=parseInt(String(v.payments_made).replace(/\D/g,''),10);
    if(isFinite(total)&&isFinite(paid)&&total>=paid) v.remaining_payments=String(total-paid);
  }
  if(v.remaining_payments && !v.contract_end_date) v.contract_end_date=cliContractEndFromPayments(v.remaining_payments);
  return v;
}

function refreshCli(){ if(cliM&&cliM.id){ api('/api/clients-real/'+cliM.id).then(function(d){cliM=d;renderCli();}).catch(function(){}); } }
function closeForm(){ var m=$('formBg'); if(m)m.remove(); }
function openForm(title, fields, onSubmit){
  var rows=fields.map(function(f,i){ return '<div style="margin-bottom:10px"><div class="flbl">'+f.label+'</div>'+
    (f.type==='select'
      ? '<select class="inp" id="ff_'+i+'">'+(f.options||[]).map(function(o){return '<option value="'+o[0]+'"'+(o[0]===(f.value||'')?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'
      : '<input class="inp" id="ff_'+i+'" value="'+(f.value!=null?String(f.value).replace(/"/g,'&quot;'):'')+'" placeholder="'+(f.ph||'')+'">')+'</div>'; }).join('');
  document.body.insertAdjacentHTML('beforeend','<div class="modal-bg" id="formBg" style="z-index:210" onclick="if(event.target===this)closeForm()"><div class="modal" style="max-width:680px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">'+title+'</h3><button class="btn ghost" style="padding:6px 10px" onclick="closeForm()">✕</button></div>'+rows+'<div id="ff_err" style="color:var(--red);font-size:12px;min-height:14px"></div><button class="btn" style="width:100%;margin-top:6px" id="ff_save">Guardar</button></div></div>');
  fields.forEach(function(f,i){ if(f.autoDateTo){ var src=$('ff_'+i), dstIdx=fields.findIndex(function(x){return x.key===f.autoDateTo;}); var dst=dstIdx>=0?$('ff_'+dstIdx):null; if(src&&dst){ src.addEventListener('input',function(){dst.value=cliContractEndFromPayments(src.value);}); if(src.value&&!dst.value)dst.value=cliContractEndFromPayments(src.value); } } });
  $('ff_save').onclick=async function(){ var vals={}; fields.forEach(function(f,i){ var el=$('ff_'+i); vals[f.key]=el?el.value:''; }); try{ await onSubmit(vals); closeForm(); }catch(e){ $('ff_err').textContent=(e&&e.message)||'Error'; } };
}
async function cliEditar(){ var c=cliM; openForm('Editar cliente',[
  {key:'name',label:'Empresa',value:c.name},{key:'owner_name',label:'Dueño',value:c.owner_name},

function ocrPasteImage(e){

    if(items[i].type&&items[i].type.indexOf('image/')===0){
      e.preventDefault();
      var file=items[i].getAsFile();
      var rd=new FileReader();
      rd.onload=function(ev){ ocrPastedImage={dataUrl:ev.target.result,mime:file.type||'image/png'}; var inp=$('ocrFile'); if(inp)inp.value=''; ocrSetPreview(ev.target.result,'Imagen pegada desde portapapeles'); };

async function ocrAnalizar(){

    if(f){ var fd=new FormData(); fd.append('file',f); opts.body=fd; }
    else { opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify({image_base64:ocrPastedImage.dataUrl,mime_type:ocrPastedImage.mime}); }
    var r=await fetch(API+'/api/subscribers/extract-image',opts);
    var d=await r.json();
    if(!r.ok){ $('ocrResult').innerHTML='<div class="empty">'+((d&&d.error)||'No se pudo leer')+'</div>'; return; }
    ocrDetectedBanNumber=String((d&&d.ban_number)||'').replace(/\D/g,'')||null;
    ocrBanBlocked=false;
    if(ocrDetectedBanNumber){
      var detectedBan=(cliM&&cliM.bans||[]).find(function(b){return String(b.ban_number||'').replace(/\D/g,'')===ocrDetectedBanNumber;});
      if(detectedBan){ ocrBanId=detectedBan.id; }
      else { ocrBanBlocked=true; }
    }
    ocrRows=(d.rows||[]).map(function(x){return {phone:x.subscriber||'',plan:x.pricePlan||'',status:x.status||'',type:x.type||'',line_kind:x.line_kind||'',saveStatus:'activo'};});
    renderOcrRows(d.engine);
  }catch(e){ $('ocrResult').innerHTML='<div class="empty">Error: '+e.message+'</div>'; }

function renderOcrRows(engine){

  var rows=ocrRows.map(function(r,i){

    return '<tr><td><input class="cinp" style="width:115px;text-align:left" value="'+r.phone+'" onchange="ocrRows['+i+'].phone=this.value"></td><td><input class="cinp" style="width:95px;text-align:left" value="'+r.plan+'" onchange="ocrRows['+i+'].plan=this.value"></td><td><span class="pill green">Activo</span><div class="s" style="font-size:10px;margin-top:3px">Leído: '+raw+'</div></td><td><button class="btn ghost" style="padding:3px 8px;font-size:11px" onclick="ocrRows.splice('+i+',1);renderOcrRows()">✕</button></td></tr>';
  }).join('');

  var destBanNumber=destBan?String(destBan.ban_number||''):'desconocido';
  var banMsg=ocrDetectedBanNumber
    ? (ocrBanBlocked?'<div class="empty" style="margin-bottom:10px;color:var(--red)">La imagen dice BAN '+ocrDetectedBanNumber+', pero ese BAN no está en este cliente. No se puede agregar aquí.</div>':'<div class="s" style="margin-bottom:10px;color:var(--green)">BAN detectado en imagen: '+ocrDetectedBanNumber+'. Se agregará en ese BAN.</div>')
    : '<div class="s" style="margin-bottom:10px;color:var(--amber)">No detecté BAN en la imagen. Escribí el BAN de la imagen para confirmar destino.</div><div class="flbl">BAN de la imagen</div><input class="inp" id="ocrManualBan" maxlength="9" placeholder="9 dígitos" oninput="this.value=this.value.replace(/[^0-9]/g,String());ocrManualBanNumber=this.value">';
  $('ocrResult').innerHTML=banMsg+'<div class="s" style="margin-bottom:6px">Detecté '+ocrRows.length+' líneas'+(engine?(' · motor: '+engine):'')+'. El OCR puede leer cancelado, pero al agregar se guarda como Activo en el BAN '+destBanNumber+'.</div><div class="card" style="overflow-x:auto"><table><thead><tr><th>Teléfono</th><th>Plan</th><th>Se guardará como</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div><button class="btn green" style="width:100%;margin-top:12px" '+(ocrBanBlocked?'disabled':'')+' onclick="ocrAgregar()">+ Agregar '+ocrRows.length+' suscriptores activos al BAN '+destBanNumber+'</button>';

async function ocrAgregar(){
  if(ocrBanBlocked){ alert('No se puede agregar: la imagen pertenece al BAN '+ocrDetectedBanNumber+' y ese BAN no está en este cliente.'); return; }
  var expectedBan=ocrDetectedBanNumber||String(ocrManualBanNumber||(($('ocrManualBan')&&$('ocrManualBan').value)||'')).replace(/\D/g,'');

  if(expectedBan.length!==9){ alert('El BAN de la imagen debe tener 9 dígitos.'); return; }

  for(var i=0;i<ocrRows.length;i++){ var r=ocrRows[i]; var ph=String(r.phone||'').replace(/\D/g,''); if(ph.length!==10){fail++;continue;} if(/^100/.test(ph)){fail++;continue;} if(!/^(787|939|989)\d{7}$/.test(ph)){fail++;errs.push(ph+': el suscriptor debe comenzar con 787, 939 o 989');continue;}

      var resp=await fetch(API+'/api/bans-real/'+ocrBanId+'/subscribers',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({phone:ph,plan:r.plan||null,line_kind:lk,product_type:r.type||null,status:'activo',expected_ban_number:expectedBan})});

    }catch(e){ fail++; errs.push(ph+': '+e.message); } }
  cerrarOCR(); refreshCli(); alert('Procesados: '+ok+' · nuevos: '+created+' · actualizados: '+updated+(reactivated?(' · reactivados desde cancelado: '+reactivated):'')+(fail?(' · fallaron: '+fail+(errs.length?('\\n'+errs.slice(0,4).join('\\n')):'')):''));

// ---- Cliente Voz (dictado del navegador + parser sin IA) ----
let vozRec=null, vozRecording=false;
const VOZ_PRODS=[['','(sin producto)'],['fijo_ren','Fijo Ren'],['fijo_new','Fijo New'],['movil_ren','Movil Ren'],['movil_new','Movil New'],['claro_tv','Claro TV'],['cloud','Cloud'],['mpls','MPLS']];
function parseVoz(t){
  const low=(t||'').toLowerCase();
  const digits=((t||'').match(/\d/g)||[]).join('');
  const pm=digits.match(/(787|939|989)?\d{7}/); const telefono=pm?pm[0]:'';
  const prodMap=[['fijo ren','fijo_ren'],['fijo renov','fijo_ren'],['fijo new','fijo_new'],['fijo nuev','fijo_new'],['movil ren','movil_ren'],['móvil ren','movil_ren'],['movil renov','movil_ren'],['móvil renov','movil_ren'],['movil new','movil_new'],['móvil new','movil_new'],['movil nuev','movil_new'],['móvil nuev','movil_new'],['claro tv','claro_tv'],['cloud','cloud'],['mpls','mpls']];
  let product_key=''; for(const[k,v]of prodMap){ if(low.includes(k)){product_key=v;break;} }
  let empresa=''; const em=t&&t.match(/(?:empresa|cliente|negocio)\s+([a-zA-ZáéíóúñÑ0-9 .&'-]+?)(?:\s+(?:tel[eé]fono|telefono|fijo|m[oó]vil|movil|claro|cloud|mpls|n[uú]mero|quiere|son|de)\b|[,.]|$)/i); if(em)empresa=em[1].trim();
  let qty=''; const qm=low.match(/(\d+)\s*(l[ií]neas?|m[oó]viles?|fijos?|tv|equipos?|cuentas?)/); if(qm)qty=qm[1];
  let monto=''; const mm=t&&t.match(/\$\s*([0-9]+(?:[.,][0-9]+)?)/); if(mm)monto=mm[1].replace(',','');
  return {empresa,telefono,product_key,qty,monto};
}
function vozFields(p){
  if(p.empresa)$('vz_emp').value=p.empresa;
  if(p.telefono)$('vz_tel').value=p.telefono;
  if(p.product_key)$('vz_prod').value=p.product_key;
  if(p.qty)$('vz_qty').value=p.qty;
  if(p.monto)$('vz_monto').value=p.monto;
}

async function viewVendedores(){
  let vlist=[]; try{ vlist=await api('/api/vendedores'); }catch(e){}
  let sales=[]; try{ sales=await api('/api/sales'); }catch(e){}
  const ym=venMonth.slice(0,7);
  const agg={}; vlist.forEach(function(v){ agg[v]={ventas:0,vendido:0,comision:0}; });
  sales.filter(function(s){ return String(s.sale_date||'').slice(0,7)===ym; }).forEach(function(s){
    const v=s.vendor_name||'—'; if(!agg[v]) agg[v]={ventas:0,vendido:0,comision:0};
    agg[v].ventas++; agg[v].vendido+=Number(s.monthly_value||0); agg[v].comision+=Number(s.vendor_commission||0);
  });
  const rows=Object.entries(agg).sort(function(a,b){ return b[1].vendido-a[1].vendido; });
  const totV=rows.reduce(function(a,r){return a+r[1].vendido;},0);
  const totC=rows.reduce(function(a,r){return a+r[1].comision;},0);
  const yr=new Date(venMonth).getFullYear();
  const monOpts=Array.from({length:12},function(_,m){const mo=yr+'-'+String(m+1).padStart(2,'0')+'-01';return `<option value="${mo}" ${mo===venMonth?'selected':''}>${mo}</option>`;}).join('');
  const body=rows.map(function(r,i){ const v=r[0],d=r[1];
    return `<tr><td class="c" style="color:var(--txt3);font-weight:800">${i+1}</td><td><div class="cli"><span class="av">${ini(v)}</span><b>${esc(v)}</b></div></td><td class="c"><span class="qty">${d.ventas}</span></td><td class="r">${money(d.vendido)}</td><td class="r" style="color:var(--green);font-weight:700">${money(d.comision)}</td></tr>`;
  }).join('');
  return `<div class="head"><div><h1>Vendedores</h1><div class="s">Vendedores de Tango · ventas, vendido y comisión por mes · regla: vienen de Tango</div></div><select class="inp" style="max-width:160px" onchange="setVenMonth(this.value)">${monOpts}</select></div>
  <div class="kpis"><div class="kpi"><div class="l">Vendedores</div><div class="v">${vlist.length}</div></div><div class="kpi"><div class="l">Vendido (mes)</div><div class="v">${money(totV)}</div></div><div class="kpi"><div class="l">Comisión vendedor (mes)</div><div class="v" style="color:var(--green)">${money(totC)}</div></div></div>
  <div class="card"><table><thead><tr><th class="c">#</th><th>Vendedor</th><th class="c">Ventas</th><th class="r">Vendido</th><th class="r">Comisión vend.</th></tr></thead><tbody>${body||'<tr><td colspan="5" class="empty">Sin ventas de vendedores este mes.</td></tr>'}</tbody></table></div>`;
}

function coFiltered(){
  var s=(($('coSearch')&&$('coSearch').value)||'').toLowerCase().trim();
  return coClientes.filter(function(c){ return (coTab==='activo'?c.activo:!c.activo) && (!s || (c.name||'').toLowerCase().includes(s) || (c.email||'').toLowerCase().includes(s)); });

function coRenderList(){
  var el=$('coList'); if(!el)return; var list=coFiltered();
  if(!list.length){ el.innerHTML='<div class="empty">Sin clientes con email en esta vista</div>'; coUpdCount(); return; }
  el.innerHTML='<div style="max-height:420px;overflow-y:auto">'+list.map(function(c){
    var on=coSel.has(c.email);

  }).join('')+'</div>'; coUpdCount();
}
function coToggle(email){ if(coSel.has(email))coSel.delete(email); else coSel.add(email); coRenderList(); }
function coSelAll(on){ if(on){ coFiltered().forEach(function(c){coSel.add(c.email);}); } else { coFiltered().forEach(function(c){coSel.delete(c.email);}); } coRenderList(); }
function coUpdCount(){ var el=$('coCount'); if(el)el.innerHTML='<b>'+coSel.size+'</b> destinatarios seleccionados'; }
// Idéntico al viejo: abre el cliente de correo predeterminado con los destinatarios en CCO.
function coOutlook(){
  if(!coSel.size){ alert('Seleccioná al menos un cliente'); return; }
  var p=new URLSearchParams();
  var subj=($('coSubj')&&$('coSubj').value)||''; if(subj)p.set('subject',subj);
  var body=(($('coBody')&&$('coBody').value)||'')+CO_FIRMA; if(body)p.set('body',body);
  var url='mailto:?bcc='+encodeURIComponent([...coSel].join(';'))+'&'+p.toString();
  if(url.length>1900){ if(!confirm('Son muchos destinatarios ('+coSel.size+'); el enlace puede quedar muy largo para abrir de una. ¿Intentar igual? Si no abre, mandá en lotes más chicos.'))return; }
  window.location.href=url;
}
function coOutlookWeb(){
  if(!coSel.size){ alert('Seleccioná al menos un cliente'); return; }
  var p=new URLSearchParams();
  p.set('to',[...coSel].join(','));
  var subj=($('coSubj')&&$('coSubj').value)||''; if(subj)p.set('subject',subj);
  var body=(($('coBody')&&$('coBody').value)||'')+CO_FIRMA; if(body)p.set('body',body);
  var url='https://outlook.office.com/mail/deeplink/compose?'+p.toString();
  if(url.length>1900){ if(!confirm('Son muchos destinatarios ('+coSel.size+'); Outlook Web puede rechazar enlaces largos. ¿Intentar igual?'))return; }
  window.open(url,'_blank','noopener');
}

function impHandleFile(f){

        ? window.ImportWorkbook.parseOperationalWorkbook(wb,XLSX) : {isOperationalWorkbook:false};
      if(operational.isOperationalWorkbook){
        impOperational=operational;
        impRows=operational.rows;
        impHeaders=['Empresa','Email','BAN','SUB','ACCTYPE','SUB_STATUS','SOC','PRECIO','PRODUCT_TYPE','COMMIT_START_DATE','COMMIT_END_DATE','CREDIT_CLASS','NO_OF_INSTALL_FROM','TOTAL_NO_OF_INSTALL','ITEM_ID','ITEM_LDESC','PLAZOS_RESTANTES','Tipo de línea'];
        impMap={};
        var operationalMap={company:0,email:1,ban:2,sub_phone:3,account_type:4,status:5,soc:6,monthly_value:7,product_type:8,contract_start_date:9,contract_end_date:10,credit_class:11,installment_from:12,installment_total:13,item_id:14,equipment:15,remaining_payments:16,line_kind:17};
        Object.keys(operationalMap).forEach(function(k){impMap[k]=operationalMap[k];});
        $('impDrop').innerHTML='<span class="dz-ico">📄</span><b>'+f.name+'</b><div class="s" style="margin-top:4px">Archivo operativo Claro reconocido · '+impRows.length+' líneas listas para verificar</div>';
        renderImpStep2();
        return;
      }
      impOperational=null;
      var ws=wb.Sheets[wb.SheetNames[0]];
      var data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(!data.length){ $('impStep2').innerHTML='<div class="empty">El Excel está vacío</div>'; return; }
      impHeaders=data[0].map(function(h){return String(h||'').trim();});
      impRows=data.slice(1).filter(function(r){return r.some(function(c){return String(c||'').trim();});});
      impMap={}; var taken={}; IMP_FIELDS.forEach(function(fd){ var idx=-1; for(var i=0;i<impHeaders.length;i++){ if(!taken[i]&&impAutoDetect(impHeaders[i].toLowerCase(),fd[0])){ idx=i; break; } } if(idx>=0){ impMap[fd[0]]=idx; taken[idx]=1; } });
      $('impDrop').innerHTML='<span class="dz-ico">📄</span><b>'+f.name+'</b><div class="s" style="margin-top:4px">'+impRows.length+' filas · '+impHeaders.length+' columnas · clic para cambiar</div>';
      renderImpStep2();
    }catch(err){ $('impStep2').innerHTML='<div class="empty">No se pudo leer: '+err.message+'</div>'; }
  };
  rd.readAsArrayBuffer(f);
}

    else if(route==='comparativa')html=await viewComparativa();
    else if(route==='config')html=await viewConfig();
    else if(route==='correos')html=await viewCorreos();
    else if(route==='campanas')html=await viewCampanas();
    else if(route==='import')html=await viewImport();
        else if(route==='ofertas')html=await viewOfertas();
        else if(route==='prospeccion')html=await viewProspeccion();
        else if(route==='directorio')html=await viewDirectorioOperaciones();
        else html=await viewClientes();
    $('view').innerHTML=html;
    if(route==='import')impInitDrop();
    if(route==='ofertas')ofRenderBody();
    if(route==='prospeccion')prInit();
    if(route==='config')cfgRenderBody();
    if(route==='correos')coInit();
  }catch(e){$('view').innerHTML='<div class="empty">Error: '+e.message+'</div>';}
}
window.addEventListener('hashchange',router);

// ---------------- SESIÓN / LOGIN (Tango V2) ----------------
function setSession(t,u){ token=t; currentUser=u; try{localStorage.setItem('vp_token',t);localStorage.setItem('vp_user',JSON.stringify(u||{}));}catch(e){} }
function clearSession(){ token=null; currentUser=null; try{localStorage.removeItem('vp_token');localStorage.removeItem('vp_user');}catch(e){} }
function logout(){ clearSession(); showLogin(); }
function connOk(){ $('conn').className='conn ok'; $('conn').textContent='✓ '+((currentUser&&currentUser.nombre)?currentUser.nombre:'conectado'); }
function showLogin(msg){
  if($('loginBg')) return;
  document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="loginBg" style="z-index:200"><div class="modal" style="max-width:380px">
    <div class="brand" style="justify-content:center;color:var(--txt);margin-bottom:4px"><span class="logo">V</span> VentasPro</div>
    <div class="s" style="text-align:center;margin-bottom:16px">Ingresá con tu usuario de Tango</div>
    <div class="flbl">Usuario</div><input class="inp" id="lg_user" style="margin-bottom:10px">
    <div class="flbl">Contraseña</div><input class="inp" id="lg_pass" type="password" style="margin-bottom:14px" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="lg_err" style="color:var(--red);font-size:12.5px;min-height:16px;margin-bottom:8px">${msg||''}</div>
    <button class="btn" style="width:100%" onclick="doLogin()">Entrar con Claro (Tango)</button>
    <div style="text-align:center;margin:12px 0 6px;color:var(--txt3);font-size:11px">— o para probar en esta PC —</div>
    <button class="btn ghost" style="width:100%" onclick="devEntrar()">Entrar en modo demo (local)</button>
    <div class="s" style="text-align:center;margin-top:10px;font-size:11px">El login de Claro funciona en el servidor. En tu PC, Tango bloquea por IP — usá el modo demo.</div>
  </div></div>`);
  setTimeout(()=>{var u=$('lg_user');if(u)u.focus();},60);
}
async function doLogin(){
  const usuario=($('lg_user').value||'').trim(), password=$('lg_pass').value||'';
  if(!usuario||!password){ $('lg_err').textContent='Poné usuario y contraseña'; return; }
  $('lg_err').textContent='Entrando…';
  try{
    const r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario,password})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ $('lg_err').textContent=d.error||'No se pudo entrar'; return; }
    setSession(d.token,d.user); var bg=$('loginBg'); if(bg)bg.remove(); connOk(); router();
  }catch(e){ $('lg_err').textContent='No conecta al backend'; }
}
async function devEntrar(){
  try{ const r=await fetch(API+'/api/auth/dev-login',{method:'POST'}); if(!r.ok){$('lg_err').textContent='Modo demo no disponible (producción)';return;} const d=await r.json(); setSession(d.token,d.user); var bg=$('loginBg'); if(bg)bg.remove(); connOk(); router(); }
  catch(e){ $('lg_err').textContent='Modo demo no disponible'; }
}
async function init(){
  // Login DESACTIVADO por ahora (hasta deploy): entra solo en local con dev-login.
  // En prod (sin dev-login) este intento falla -> ahí sí aparece el login de Claro.
  let t=null,u=null; try{ t=localStorage.getItem('vp_token'); u=JSON.parse(localStorage.getItem('vp_user')||'null'); }catch(e){}
  if(t){ token=t; currentUser=u;
    try{ const me=await fetch(API+'/api/me',{headers:{Authorization:'Bearer '+t}}); if(me.ok){ currentUser=(await me.json()).user; connOk(); router(); return; } }catch(e){}
    clearSession();
  }
  try{ const r=await fetch(API+'/api/auth/dev-login',{method:'POST'}); if(r.ok){ const d=await r.json(); setSession(d.token,d.user); connOk(); router(); return; } }catch(e){}
  $('conn').textContent='—'; showLogin();
}
init();
</script>
