<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VentasPro Nuevo</title>
<style>
  body[data-theme="day"]{ --bg:#e9edf6; --card:#fff; --card2:#f4f6fc; --line:#e3e8f2; --txt:#1f2740; --txt2:#5b6480; --txt3:#9099b3; --primary:#2f6bff; --primary-soft:#e8efff; --green:#15a35a; --green-soft:#d8f5e6; --green-border:#a7e3c4; --amber:#c9820a; --amber-soft:#fdf0d4; --amber-border:#f0d294; --red:#dc2626; --red-soft:#fde7e7; --violet:#6d57e0; --violet-soft:#ece8fc; --teal:#0d9488; --teal-soft:#d4f3ef; --track:#e7ebf3;}
  body[data-theme="dark"]{ --bg:#0f1320; --card:#1a1f33; --card2:#212744; --line:rgba(255,255,255,0.08); --txt:#eef0fb; --txt2:#9aa3bd; --txt3:#6b7494; --primary:#4b82ff; --primary-soft:rgba(75,130,255,0.16); --green:#34d399; --green-soft:rgba(52,211,153,0.15); --green-border:rgba(52,211,153,0.4); --amber:#fbbf5a; --amber-soft:rgba(251,191,90,0.15); --amber-border:rgba(251,191,90,0.4); --red:#f87171; --red-soft:rgba(248,113,113,0.13); --violet:#a78bfa; --violet-soft:rgba(139,124,246,0.18); --teal:#2dd4bf; --teal-soft:rgba(45,212,191,0.15); --track:rgba(255,255,255,0.08);}
  *{box-sizing:border-box;margin:0;padding:0;} a{color:inherit;text-decoration:none;}
  body{font-family:"Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);display:flex;min-height:100vh;}
  .side{width:206px;flex-shrink:0;background:#0e1426;color:#cdd5ea;padding:18px 12px;overflow-y:auto;max-height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;color:#fff;padding:6px 8px 16px;}
  .brand .logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#4b82ff,#6d57e0);display:flex;align-items:center;justify-content:center;}
  .nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:13.5px;color:#aab3cd;cursor:pointer;margin-bottom:2px;}
  .nav.on{background:var(--primary);color:#fff;} .nav .d{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--card);}
  .conn{font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:999px;}
  .conn.ok{color:var(--green);background:var(--green-soft);border:1px solid var(--green-border);} .conn.bad{color:var(--red);background:var(--red-soft);}
  .sp{flex:1;} .toggle{background:var(--primary);color:#fff;border:none;border-radius:11px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .content{padding:22px;overflow:auto;}
  h1{font-size:23px;font-weight:700;} .crumb{font-size:13px;color:var(--txt2);margin-bottom:14px;} .crumb a{color:var(--primary);}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .head .s{font-size:12.5px;color:var(--txt2);}
  .btn{background:var(--primary);color:#fff;border:none;border-radius:11px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn.green{background:var(--green);} .btn.ghost{background:var(--card2);color:var(--txt2);border:1px solid var(--line);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--txt3);font-weight:500;font-size:11px;text-transform:uppercase;padding:12px 16px;background:var(--card2);}
  td{padding:13px 16px;border-top:1px solid var(--line);}
  tr.click{cursor:pointer;} tr.click:hover{background:var(--card2);}
  .av{width:34px;height:34px;border-radius:10px;background:var(--violet-soft);color:var(--violet);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
  .cli{display:flex;align-items:center;gap:11px;}
  .pill{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;}
  .pill.green{color:var(--green);background:var(--green-soft);} .pill.amber{color:var(--amber);background:var(--amber-soft);} .pill.red{color:var(--red);background:var(--red-soft);} .pill.violet{color:var(--violet);background:var(--violet-soft);}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 16px;}
  .kpi .l{font-size:10.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;} .kpi .v{font-size:21px;font-weight:700;margin-top:3px;}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start;} @media(max-width:900px){.grid2{grid-template-columns:1fr;}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px;}
  .panel h3{font-size:13px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}
  .steps{display:flex;flex-direction:column;gap:8px;}
  .step{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;background:var(--card2);}
  .step.done{background:var(--green-soft);} .step.cur{border:1.5px solid var(--green-border);}
  .sdot{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;background:var(--card);border:1px solid var(--line);color:var(--txt3);}
  .sdot.done{background:var(--green);color:#fff;border:none;}
  .flowgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;}
  .flowcard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px;}
  .flowhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .flowtitle{font-weight:800;color:var(--txt);font-size:13px;}
  .flowcount{margin-left:auto;color:var(--txt3);font-size:11px;font-weight:700;}
  .flowbar{height:7px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:12px;}
  .flowbar span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--teal));border-radius:99px;}
  .nowstep{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--green-border);border-radius:11px;padding:10px 11px;margin-bottom:10px;}
  .nowstep .label{font-size:10px;text-transform:uppercase;color:var(--green);font-weight:800;letter-spacing:.04em;}
  .nowstep .name{font-size:14px;font-weight:800;color:var(--txt);margin-top:1px;}
  .stepchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:7px;}
  .stepchip{min-height:42px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:7px 8px;font-size:11px;color:var(--txt2);display:flex;align-items:center;gap:7px;}
  .stepchip .n{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--card2);color:var(--txt3);font-size:10px;font-weight:800;flex-shrink:0;}
  .stepchip.done{background:var(--green-soft);color:var(--green);border-color:var(--green-border);}
  .stepchip.done .n{background:var(--green);color:#fff;}
  .stepchip.cur{border-color:var(--green-border);box-shadow:0 0 0 2px var(--green-soft);}
  .logitem{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line);} .logitem:first-child{border-top:none;}
  .lic{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .lic.llamada{background:var(--primary-soft);} .lic.nota{background:var(--violet-soft);} .lic.paso{background:var(--green-soft);}
  .bar{height:10px;background:var(--track);border-radius:6px;overflow:hidden;} .bar .fill{height:100%;border-radius:6px;background:var(--green);}
  .prow{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line);} .prow:first-child{border-top:none;}
  .inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--txt);font-family:inherit;}
  .empty{padding:26px;text-align:center;color:var(--txt3);}
  .ccard{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;}
  .chead{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;flex-wrap:wrap;}
  .chead .ar{color:var(--txt3);font-size:11px;} .ccard.open .chead .ar{transform:rotate(90deg);}
  .clines{display:none;padding:2px 16px 12px;flex-direction:column;gap:8px;} .ccard.open .clines{display:flex;}
  .cline{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;flex-wrap:wrap;}
  .cinp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--txt);text-align:right;}
  .qty{display:inline-block;min-width:28px;padding:2px 9px;border-radius:6px;background:var(--green-soft);color:var(--green);font-weight:700;border:1px solid var(--green-border);}
  .grow{cursor:pointer;} .grow:hover{background:var(--card2);} .grow .ar{color:var(--txt3);font-size:11px;}
  td.c,th.c{text-align:center;} td.r,th.r{text-align:right;}
  .lrow td{background:var(--card2);}
  .kpi.click{cursor:pointer;transition:border-color .15s,box-shadow .15s;} .kpi.click:hover{border-color:var(--primary);}
  .kpi.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft);}
  .kpi .bk{font-size:11.5px;color:var(--txt2);margin-top:7px;line-height:1.65;}
  .kpi .v .tot{font-size:11px;font-weight:500;color:var(--txt3);margin-left:6px;}
  .search{max-width:340px;}
  .acell{display:flex;flex-direction:column;gap:4px;align-items:stretch;}
  .astep{display:flex;justify-content:space-between;align-items:center;gap:4px;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:10.5px;color:var(--txt2);cursor:pointer;}
  .astep:hover{border-color:var(--primary);}
  .asubs{font-size:9.5px;color:var(--txt3);}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto;}
  .flbl{font-size:10.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
  .ctabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;}
  .ctab{background:none;border:none;border-bottom:2px solid transparent;color:var(--txt2);padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .ctab.on{color:var(--primary);border-bottom-color:var(--primary);}
  .i3{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;}
  .i3 h4{font-size:12px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px;}
  .irow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .irow span{color:var(--txt3);} .irow b{text-align:right;}
  @media(max-width:760px){.i3{grid-template-columns:1fr;}}
  .paso-wrap{display:flex;gap:16px;align-items:flex-start;}
  .paso-side{width:190px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
  .paso-prod{padding:11px 14px;border-radius:10px;background:var(--card2);border:1px solid var(--line);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--txt2);}
  .paso-prod.on{background:var(--primary);color:#fff;border-color:var(--primary);}
  .paso-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;}
  .paso-row{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;}
  .paso-num{width:26px;height:26px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--txt3);flex-shrink:0;}
  .paso-chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--green);white-space:nowrap;}
  @media(max-width:760px){.paso-wrap{flex-direction:column;}.paso-side{width:100%;flex-direction:row;flex-wrap:wrap;}}
  .asana-kpis{display:grid;grid-template-columns:1.3fr repeat(3,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
  .asana-kpis .kpi{min-height:86px;}
  .asana-kpis .main{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft);}
  .kpi .hint{font-size:11.5px;color:var(--txt2);margin-top:6px;line-height:1.45;}
  .logbox{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:start;margin-bottom:12px;}
  .logbody{min-height:76px;resize:vertical;text-align:left;}
  .logmeta{font-size:11px;color:var(--txt3);margin-top:3px;}
  @media(max-width:900px){.asana-kpis{grid-template-columns:1fr 1fr;}.asana-kpis .main{grid-column:1/-1;}}
  @media(max-width:720px){.logbox{grid-template-columns:1fr;}.logbox .btn{width:100%;}}
</style>

<body data-theme="dark">
  <aside class="side">
    <div class="brand"><span class="logo">V</span> VentasPro</div>

    <a class="nav" href="#/clientes"><span class="d"></span>Clientes</a>

  </aside>
  <div class="main">
    <div class="topbar"><span id="conn" class="conn bad">conectando…</span><div class="sp"></div><button class="btn ghost" style="padding:9px 13px;margin-right:8px" onclick="logout()">Salir</button><button class="toggle" onclick="tog()"><span id="tgt">Modo día</span></button></div>
    <div class="content" id="view"><div class="empty">Cargando…</div></div>

<script>
const API=''; // mismo origen: funciona en localhost:4000 y en el servidor (sin hardcodear host)
let token=null, currentUser=null;
const $=(id)=>document.getElementById(id);
function tog(){const b=document.body,d=b.getAttribute('data-theme')==='day';b.setAttribute('data-theme',d?'dark':'day');$('tgt').textContent=d?'Modo día':'Modo noche';}
function money(n){return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function ini(n){return (n||'?').trim().slice(0,2).toUpperCase();}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function api(p,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+token};if(opts.body&&typeof opts.body!=='string'){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body);}const r=await fetch(API+p,opts);if(r.status===401){clearSession();showLogin('Tu sesión venció, entrá de nuevo');throw new Error('401');}if(!r.ok&&r.status!==409)throw new Error(p+' -> '+r.status);return r.json();}
function monthStart(){const m=new Date();return m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-01';}

// ---------------- VIEWS ----------------
// ---- Clientes: estado de pantalla (tab + búsqueda + página) ----
let cliTab='active', cliQ='', cliPage=1;
const CLI_TABS=[['active','Activos'],['cancelled','Cancelados'],['following','Seguimiento'],['incomplete','Incompletos']];
const CLI_PILL={active:'green',cancelled:'red',following:'violet',incomplete:'amber'};
async function reClientes(){ $('view').innerHTML=await viewClientes(); }
function setCliTab(t){ cliTab=t; cliPage=1; reClientes(); }
function cliSearch(ev){ if(ev.key==='Enter'){ cliQ=ev.target.value.trim(); cliPage=1; reClientes(); } }
function cliPageGo(d){ cliPage+=d; reClientes(); }
function fmtDate(d){ if(!d) return '—'; const x=new Date(d); if(isNaN(x)) return '—'; return x.toLocaleDateString('es-PR',{day:'numeric',month:'numeric',year:'numeric'}); }
function vencBadge(d){ if(!d) return ''; const days=Math.floor((new Date(d)-new Date())/86400000); if(isNaN(days)) return ''; if(days<0) return `<div class="pill red" style="margin-top:3px;font-size:10px">Vencido hace ${-days} días</div>`; if(days<=60) return `<div class="pill amber" style="margin-top:3px;font-size:10px">Vence en ${days} días</div>`; return ''; }

async function viewClientes(){
  const d=await api(`/api/clients-real?tab=${cliTab}&q=${encodeURIComponent(cliQ)}`);
  const st=d.stats||{}, lm=st.line_metrics||{};
  const counts={active:st.active_count,cancelled:st.cancelled_count,following:st.following_count,incomplete:st.incomplete_count};
  const card=(t,label)=>{ const m=lm[t]||{}, on=cliTab===t; return `<div class="kpi click${on?' on':''}" onclick="setCliTab('${t}')">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="l">${label}</span><span class="pill ${CLI_PILL[t]}">${counts[t]??0}</span></div>
    <div class="bk">Móvil <b>${m.mobile_lines||0}</b> · Fijo <b>${m.fixed_lines||0}</b> <span style="color:var(--green)">${money(m.fixed_monthly_value)}</span><br>TV <b>${m.claro_tv_lines||0}</b> · MPLS <b>${m.mpls_lines||0}</b> · Cloud <b>${m.cloud_lines||0}</b> · Inc <b>${m.incomplete_lines||0}</b></div></div>`; };
  const all=d.clients||[], per=50, pages=Math.max(1,Math.ceil(all.length/per)); if(cliPage>pages)cliPage=pages; const from=(cliPage-1)*per, rows=all.slice(from,from+per);
  const tr=c=>{ const bans=(c.ban_numbers||'').split(', ').filter(Boolean); const banShow=bans.length?bans[0]+(bans.length>1?` <span style="color:var(--txt3)">(+${bans.length-1})</span>`:''):'—'; const subN=Number(c.subscriber_count||0); const sub=c.primary_subscriber_phone?(c.primary_subscriber_phone+(subN>1?` <span style="color:var(--txt3)">(+${subN-1})</span>`:'')):'—'; const act=Number(c.active_ban_count||0)>0; const nombre=c.name?`<b>${c.name}</b>`:'<b style="color:var(--txt3)">sin nombre</b>'; return `<tr class="click" onclick="abrirCliente('${c.id}')">
    <td><div class="cli"><span class="av">${ini(c.name||'?')}</span>${nombre}</div></td>
    <td>${c.phone||c.mobile||c.cellular||'—'}</td>
    <td style="color:var(--txt2)">${fmtDate(c.last_activity)}</td>
    <td>${c.primary_service_type||'—'}</td>
    <td><span class="pill" style="background:var(--card2);color:var(--txt2)">${c.base||'BD propia'}</span></td>
    <td><span class="pill ${act?'green':'red'}">${act?'Activo':'Cancelado'}</span></td>
    <td>${c.vendor_name||'<span style="color:var(--txt3)">Sin asignar</span>'}</td>
    <td>${banShow}</td>
    <td>${sub}</td>
    <td>${fmtDate(c.primary_contract_end_date)}${vencBadge(c.primary_contract_end_date)}</td>
    <td style="text-align:center;color:var(--primary)">→</td></tr>`; };
  return `<div class="head"><div><h1>Clientes</h1><div class="s">Información de todos los clientes · data REAL de crm_pro</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button class="btn ghost" onclick="alert('Reportes: próximamente')">📊 Reportes</button>
      <button class="btn" style="background:var(--violet)" onclick="alert('Generar Oferta IA: próximamente')">✨ Generar Oferta IA</button>
      <button class="btn ghost" onclick="alert('Exportar: próximamente')">⬇ Exportar</button>
      <button class="btn" onclick="nuevoCliente()">+ Nuevo cliente</button>
    </div></div>

let ocrRows=[], ocrBanId=null;
function cerrarOCR(){ var m=$('ocrBg'); if(m)m.remove(); }
function abrirOCR(banId){
  ocrBanId=banId; ocrRows=[];
  document.body.insertAdjacentHTML('beforeend','<div class="modal-bg" id="ocrBg" style="z-index:210" onclick="if(event.target===this)cerrarOCR()"><div class="modal" id="ocrModal" style="max-width:680px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">📷 Subir/Pegar — leer suscriptores</h3><button class="btn ghost" style="padding:6px 10px" onclick="cerrarOCR()">✕</button></div><div class="s" style="margin-bottom:10px">Subí una foto/captura de la lista de suscriptores. Vision lee teléfonos, plan y estado.</div><input type="file" id="ocrFile" accept="image/*" class="inp" style="margin-bottom:10px"><button class="btn" id="ocrGo" onclick="ocrAnalizar()">🔎 Analizar imagen</button><div id="ocrResult" style="margin-top:14px"></div></div></div>');
}
async function ocrAnalizar(){
  var f=$('ocrFile').files[0]; if(!f){ alert('Elegí una imagen'); return; }
  $('ocrGo').textContent='Analizando…'; $('ocrGo').disabled=true;
  try{
    var fd=new FormData(); fd.append('file',f);
    var r=await fetch(API+'/api/subscribers/extract-image',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});
    var d=await r.json();
    if(!r.ok){ $('ocrResult').innerHTML='<div class="empty">'+((d&&d.error)||'No se pudo leer')+'</div>'; return; }
    ocrRows=(d.rows||[]).map(function(x){return {phone:x.subscriber||'',plan:x.pricePlan||'',status:x.status||'',type:x.type||''};});
    renderOcrRows(d.engine);
  }catch(e){ $('ocrResult').innerHTML='<div class="empty">Error: '+e.message+'</div>'; }
  finally{ var g=$('ocrGo'); if(g){g.textContent='🔎 Analizar imagen'; g.disabled=false;} }
}
function renderOcrRows(engine){
  if(!ocrRows.length){ $('ocrResult').innerHTML='<div class="empty">No detecté líneas. Probá con una foto más clara/recortada.</div>'; return; }
  var rows=ocrRows.map(function(r,i){return '<tr><td><input class="cinp" style="width:115px;text-align:left" value="'+r.phone+'" onchange="ocrRows['+i+'].phone=this.value"></td><td><input class="cinp" style="width:95px;text-align:left" value="'+r.plan+'" onchange="ocrRows['+i+'].plan=this.value"></td><td>'+(r.status||'—')+'</td><td><button class="btn ghost" style="padding:3px 8px;font-size:11px" onclick="ocrRows.splice('+i+',1);renderOcrRows()">✕</button></td></tr>';}).join('');
  $('ocrResult').innerHTML='<div class="s" style="margin-bottom:6px">Detecté '+ocrRows.length+' líneas'+(engine?(' · motor: '+engine):'')+'. Revisá y agregá:</div><div class="card" style="overflow-x:auto"><table><thead><tr><th>Teléfono</th><th>Plan</th><th>Estado</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div><button class="btn green" style="width:100%;margin-top:12px" onclick="ocrAgregar()">+ Agregar '+ocrRows.length+' suscriptores al BAN</button>';
}
async function ocrAgregar(){
  var ok=0,fail=0;
  for(var i=0;i<ocrRows.length;i++){ var r=ocrRows[i]; var ph=String(r.phone||'').replace(/\D/g,''); if(ph.length!==10){fail++;continue;}
    var lk=(r.type||'').toLowerCase().indexOf('fij')>=0?'fijo':((r.type||'').toLowerCase().indexOf('m')>=0?'movil':null);
    try{ await api('/api/bans-real/'+ocrBanId+'/subscribers',{method:'POST',body:{phone:ph,plan:r.plan||null,line_kind:lk}}); ok++; }catch(e){ fail++; } }
  cerrarOCR(); refreshCli(); alert('Agregados: '+ok+(fail?(' · fallaron: '+fail+' (teléfono debe ser 10 dígitos)'):''));
}

let vozRec=null, vozRecording=false;
const VOZ_PRODS=[['','(sin producto)'],['fijo_ren','Fijo Ren'],['fijo_new','Fijo New'],['movil_ren','Movil Ren'],['movil_new','Movil New'],['claro_tv','Claro TV'],['cloud','Cloud'],['mpls','MPLS']];
function parseVoz(t){
  const low=(t||'').toLowerCase();
  const digits=((t||'').match(/\d/g)||[]).join('');
  const pm=digits.match(/(787|939|989)?\d{7}/); const telefono=pm?pm[0]:'';
  const prodMap=[['fijo ren','fijo_ren'],['fijo renov','fijo_ren'],['fijo new','fijo_new'],['fijo nuev','fijo_new'],['movil ren','movil_ren'],['móvil ren','movil_ren'],['movil renov','movil_ren'],['móvil renov','movil_ren'],['movil new','movil_new'],['móvil new','movil_new'],['movil nuev','movil_new'],['móvil nuev','movil_new'],['claro tv','claro_tv'],['cloud','cloud'],['mpls','mpls']];
  let product_key=''; for(const[k,v]of prodMap){ if(low.includes(k)){product_key=v;break;} }
  let empresa=''; const em=t&&t.match(/(?:empresa|cliente|negocio)\s+([a-zA-ZáéíóúñÑ0-9 .&'-]+?)(?:\s+(?:tel[eé]fono|telefono|fijo|m[oó]vil|movil|claro|cloud|mpls|n[uú]mero|quiere|son|de)\b|[,.]|$)/i); if(em)empresa=em[1].trim();
  let qty=''; const qm=low.match(/(\d+)\s*(l[ií]neas?|m[oó]viles?|fijos?|tv|equipos?|cuentas?)/); if(qm)qty=qm[1];
  let monto=''; const mm=t&&t.match(/\$\s*([0-9]+(?:[.,][0-9]+)?)/); if(mm)monto=mm[1].replace(',','');
  return {empresa,telefono,product_key,qty,monto};
}

async function viewComisiones(){
  const meses=await api('/api/comisiones/meses');
  const mon=comMonth||(meses[0]&&meses[0].mes)||null;
  const FIL={todos:()=>true,confirmadas:x=>x.validation_status==='confirmed',revision:x=>x.validation_status==='needs_review',sync:x=>x.validation_status!=='confirmed'&&x.validation_status!=='needs_review'};

  const PN={fijo_ren:'Fijo Ren',fijo_new:'Fijo New',movil_new:'Móvil New',movil_ren:'Móvil Ren',claro_tv:'Claro TV',cloud:'Cloud',mpls:'MPLS'};
  const COLS=['fijo_ren','fijo_new','movil_new','movil_ren','claro_tv','cloud','mpls'];
  const n=x=>Number(x||0);
  const emp=rows.reduce((a,x)=>a+n(x.company_earnings),0);

  const groups={}; rows.forEach(x=>{(groups[x.empresa]=groups[x.empresa]||[]).push(x);});
  let body='';
  Object.entries(groups).forEach(function(ent,gi){
    const empName=ent[0], lines=ent[1];
    const counts={}; lines.forEach(l=>counts[l.product_key]=(counts[l.product_key]||0)+1);
    const mens=lines.reduce((a,l)=>a+n(l.monthly_value),0);
    const empc=lines.reduce((a,l)=>a+n(l.company_earnings),0);
    const comc=lines.reduce((a,l)=>a+n(l.vendor_commission),0);
    let pcells=''; COLS.forEach(k=>{ pcells+='<td class="c">'+(counts[k]?'<span class="qty">'+counts[k]+'</span>':'<span style="color:var(--txt3)">0</span>')+'</td>'; });
    body+='<tr class="grow" onclick="togg('+gi+')"><td><span class="ar" id="ar'+gi+'">▸</span> <b>'+empName+'</b></td><td style="color:var(--primary)">'+lines[0].vendedor+'</td>'+pcells+'<td class="c">—</td><td class="r">'+money(mens)+'</td><td class="r" style="color:var(--green);font-weight:700">'+money(empc)+'</td><td class="r">'+(comc?money(comc):'—')+'</td><td class="c">—</td><td class="c"><span class="pill green">'+lines.length+'</span></td></tr>';
    lines.forEach(l=>{
      body+='<tr class="lrow g'+gi+'" style="display:none"><td colspan="2"><div style="display:flex;gap:6px;flex-wrap:wrap;padding-left:18px"><span class="pill" style="background:var(--card2)">BAN '+(l.ban_number||'—')+'</span><span class="pill" style="background:var(--teal-soft);color:var(--teal)">'+(l.phone||'—')+'</span><span class="pill violet">'+(PN[l.product_key]||l.product_key)+'</span></div></td><td colspan="7"></td><td class="c"></td><td class="r">'+money(l.monthly_value)+'</td><td class="r" style="color:var(--green);font-weight:700">'+money(l.company_earnings)+'</td><td class="c"><input class="cinp" type="number" min="0" step="0.01" style="width:88px" placeholder="0" value="'+(l.vendor_commission!=null?l.vendor_commission:0)+'" onchange="editComR(\''+l.subscriber_id+'\',\''+l.report_month+'\',this.value)"></td><td class="c"></td><td class="c"><button class="btn" style="padding:5px 10px;font-size:11px;'+(l.paid?'background:var(--green)':'background:#e0860c')+'" onclick="payR(\''+l.subscriber_id+'\',\''+l.report_month+'\')">'+(l.paid?'✓ Pagado':'Pagar')+'</button></td></tr>';
    });
  });
  let head='<tr><th>Empresa</th><th>Vendedor</th>'; COLS.forEach(k=>head+='<th class="c">'+PN[k]+'</th>'); head+='<th class="c">Completado</th><th class="r">Mensualidad</th><th class="r">Empresa$</th><th class="r">Comisión$</th><th class="c">Bono</th><th class="c">Ventas</th></tr>';
  return '<div class="head"><div><h1>Comisiones y Ventas</h1><div class="s">'+rows.length+' ventas · '+Object.keys(groups).length+' clientes · data REAL de crm_pro · clic en la empresa para ver líneas</div></div>'
    +'<select class="inp" style="max-width:170px" onchange="setComMonth(this.value)">'+(meses.length?meses.map(m=>'<option value="'+m.mes+'"'+(m.mes===mon?' selected':'')+'>'+m.mes+' ('+m.n+')</option>').join(''):'<option>sin meses</option>')+'</select></div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'+COM_FILTERS.map(f=>'<button class="btn '+(comFilter===f[0]?'':'ghost')+'" style="padding:7px 14px" onclick="setComFilter(\''+f[0]+'\')">'+f[1]+'</button>').join('')+'</div>'
    +'<div class="kpis"><div class="kpi"><div class="l">Total ventas</div><div class="v" style="color:var(--violet)">'+rows.length+'</div></div><div class="kpi"><div class="l">Ganancia empresa</div><div class="v" style="color:var(--green)">'+money(emp)+'</div></div><div class="kpi"><div class="l">Comisión vendedores</div><div class="v" style="color:var(--primary)">'+money(ven)+'</div></div><div class="kpi"><div class="l">Pagado</div><div class="v" style="color:var(--amber)">'+money(pag)+'</div></div><div class="kpi"><div class="l">Balance pendiente</div><div class="v" style="color:var(--red)">'+money(emp-pag)+'</div></div></div>'
    +'<div class="card" style="overflow-x:auto"><table style="min-width:1180px"><thead>'+head+'</thead><tbody>'+(body||'<tr><td colspan="16" class="empty">Sin comisiones este mes</td></tr>')+'</tbody></table></div>';
}

let metaMonth=monthStart();

function setMetaMonth(m){ metaMonth=m; reMetas(); }
function metaMonthsList(alcance, base){
  const d=new Date(base), y=d.getFullYear(), m0=d.getMonth(), out=[];
  if(alcance==='anio'){ for(let m=0;m<12;m++) out.push(y+'-'+String(m+1).padStart(2,'0')+'-01'); }
  else if(alcance==='dic'){ for(let m=m0;m<12;m++) out.push(y+'-'+String(m+1).padStart(2,'0')+'-01'); }
  else out.push(base);
  return out;
}
async function guardarMeta(scope, salesperson, rk){
  const prods=window.__metaProds||[];
  const sel=$('sc_'+rk); const meses=metaMonthsList(sel?sel.value:'mes', metaMonth);
  try{
    for(const p of prods){
      const inp=$('m_'+rk+'_'+p.key); const qty=Number(inp?inp.value:0)||0;
      for(const mo of meses){ await api('/api/goals',{method:'POST',body:{scope, salesperson:salesperson||null, product_key:p.key, month:mo, target_qty:qty}}); }
    }
    alert('✓ Meta guardada'+(meses.length>1?(' ('+meses.length+' meses)'):''));
  }catch(e){ alert('No se pudo guardar: '+e.message); }
}
async function viewMetas(){
  const prods=await api('/api/products'); window.__metaProds=prods;
  const goals=await api('/api/goals?month='+metaMonth);
  let vendedores=[]; try{ vendedores=await api('/api/vendedores'); }catch(e){}
  const gmap={}; goals.forEach(g=>{ gmap[g.scope+'|'+(g.salesperson||'')+'|'+g.product_key]=g.target_qty; });
  const val=(sc,sp,pk)=>{ const v=gmap[sc+'|'+(sp||'')+'|'+pk]; return (v===undefined||v===null)?'':v; };
  const dinero=(sc,sp)=>prods.reduce((a,p)=>a+(Number(val(sc,sp,p.key))||0)*Number(p.income_value||0),0);
  const inputs=(sc,sp,rk)=>prods.map(p=>`<td class="c"><input class="cinp" inputmode="numeric" style="width:84px;text-align:center" id="m_${rk}_${p.key}" value="${val(sc,sp,p.key)}" placeholder="0"></td>`).join('');
  const scopeSel=(rk)=>`<select class="inp" id="sc_${rk}" style="width:140px"><option value="mes">Solo este mes</option><option value="dic">Hasta diciembre</option><option value="anio">Todo el año</option></select>`;
  const head=`<tr><th>Meta</th>${prods.map(p=>`<th class="c">${p.name}</th>`).join('')}<th class="r">Meta $</th><th>Alcance</th><th></th></tr>`;
  const negRow=`<tr><td><b>NEGOCIO</b></td>${inputs('negocio',null,'negocio')}<td class="r" style="color:var(--green);font-weight:700">${money(dinero('negocio',null))}</td><td>${scopeSel('negocio')}</td><td><button class="btn green" onclick="guardarMeta('negocio',null,'negocio')">Guardar</button></td></tr>`;
  const venRows=vendedores.map((v,i)=>{const rk='v'+i; return `<tr><td><div class="cli"><span class="av">${ini(v)}</span><b>${v}</b></div></td>${inputs('vendedor',v,rk)}<td class="r" style="color:var(--green);font-weight:600">${money(dinero('vendedor',v))}</td><td>${scopeSel(rk)}</td><td><button class="btn green" onclick='guardarMeta("vendedor",${JSON.stringify(v)},"${rk}")'>Guardar</button></td></tr>`;}).join('');
  const yr=new Date(metaMonth).getFullYear();
  const monOpts=Array.from({length:12},(_,m)=>{const mo=yr+'-'+String(m+1).padStart(2,'0')+'-01';return `<option value="${mo}" ${mo===metaMonth?'selected':''}>${mo}</option>`;}).join('');
  return `<div class="head"><div><h1>Metas</h1><div class="s">Meta del negocio y por vendedor, por producto · vendedores de Tango</div></div><select class="inp" style="max-width:160px" onchange="setMetaMonth(this.value)">${monOpts}</select></div>
  <div class="panel"><h3>Meta del negocio</h3><div style="overflow-x:auto"><table style="min-width:920px"><thead>${head}</thead><tbody>${negRow}</tbody></table></div></div>
  <div class="panel"><h3>Meta por vendedor</h3><div style="overflow-x:auto"><table style="min-width:920px"><thead>${head}</thead><tbody>${venRows||'<tr><td colspan="11" class="empty">Sin vendedores de Tango todavía (aparecen cuando tienen ventas).</td></tr>'}</tbody></table></div></div>`;
}

async function viewConfig(){
  const prods=await api('/api/products');
  const cats=await api('/api/categories');
  const pasoKey=cfgPasoKey||(prods[0]&&prods[0].key);
  let steps=[]; try{ if(pasoKey) steps=await api('/api/products/'+pasoKey+'/steps'); }catch(e){}
  const catOpts=(sel)=>cats.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${c.name}</option>`).join('');
  const prodRow=p=>`<tr>
    <td><input class="inp" value="${p.name||''}" onchange="saveProd('${p.id}','name',this.value)"></td>
    <td><select class="inp" onchange="saveProd('${p.id}','category_id',this.value)">${catOpts(p.category_id)}</select></td>
    <td><select class="inp" onchange="saveProd('${p.id}','kind',this.value)"><option value="dinero" ${p.kind==='dinero'?'selected':''}>dinero</option><option value="cantidad" ${p.kind==='cantidad'?'selected':''}>cantidad</option></select></td>
    <td><input class="cinp" style="width:110px" value="${Number(p.income_value||0)}" onchange="saveProd('${p.id}','income_value',this.value)"></td></tr>`;
  const catRow=c=>`<div class="prow">
    <input class="inp" style="max-width:170px" value="${c.name||''}" onchange="saveCat('${c.id}','name',this.value)">
    <input class="inp" style="flex:1" placeholder="descripción" value="${c.description||''}" onchange="saveCat('${c.id}','description',this.value)">
    <span class="pill violet">${prods.filter(p=>p.category_id===c.id).length} prod</span>
    <button class="btn ghost" style="padding:7px 12px" onclick="delCat('${c.id}')">🗑</button></div>`;
  const stepRow=(s,i)=>`<div class="prow">
    <span style="color:var(--txt3);width:18px">${i+1}</span>
    <input class="inp" style="flex:1" value="${s.name||''}" onchange="saveStep('${s.id}','name',this.value)">
    <button class="btn ${s.active?'green':'ghost'}" style="padding:7px 12px" onclick="toggleStep('${s.id}',${!s.active})">${s.active?'Activo':'Inactivo'}</button>
    <button class="btn ghost" style="padding:7px 12px" onclick="delStep('${s.id}')">🗑</button></div>`;
  return `<div class="head"><div><h1>Configuración</h1><div class="s">Catálogo comercial en un solo lugar · editable: productos, categorías y pasos de seguimiento</div></div></div>
  <div class="panel"><h3>Productos</h3><table><thead><tr><th>Producto</th><th>Categoría</th><th>Tipo</th><th>Valor de ingreso</th></tr></thead><tbody>${prods.map(prodRow).join('')}</tbody></table></div>
  <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0">Categorías · familias de producto</h3><button class="btn" onclick="newCat()">+ Nueva categoría</button></div>${cats.map(catRow).join('')||'<div class="empty">Sin categorías</div>'}</div>
  <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h3 style="margin:0">Asana · pasos por producto</h3><div class="s" style="margin-top:5px">Los pasos de cada producto se editan en su pantalla dedicada.</div></div><button class="btn" onclick="location.hash='#/pasos'">⚙ Configurar pasos →</button></div></div>
  <div class="panel"><h3>Vendedores y permisos</h3><div style="font-size:13px;color:var(--txt2)">Los vendedores vienen de Tango (login). Los permisos por usuario se arman de cero.</div></div>`;
}

async function viewCorreos(){return vistaSimple('Correos','Enviar ofertas y comparativas a clientes','<div class="panel"><div style="font-size:13px;color:var(--txt2)">Pantalla de correos (diseño listo). El envío real se conecta al configurar el servicio de email.</div></div>');}
async function viewCampanas(){return vistaSimple('Campañas','Envíos masivos','<div class="panel"><div style="font-size:13px;color:var(--txt2)">Pantalla de campañas (diseño listo). Se conecta al armar el envío masivo.</div></div>');}
let impHeaders=[], impRows=[], impMap={};
const IMP_FIELDS=[['empresa','Empresa / Cliente'],['ban','BAN (9 díg)'],['phone','Teléfono (10 díg)'],['plan','Plan'],['monthly_value','Mensualidad $'],['contract_end_date','Vencimiento'],['status','Estado'],['account_type','Tipo BAN']];
async function viewImport(){
  return `<div class="head"><div><h1>Importador</h1><div class="s">Actualización masiva desde Excel · el archivo manda (actualiza/crea)</div></div></div>
  <div class="panel"><h3>1) Subí el Excel</h3><input type="file" id="impFile" accept=".xlsx,.xls,.csv" class="inp" onchange="impParse()"><div class="s" style="margin-top:6px">Se lee en tu navegador. Después mapeás columnas y aplicás.</div></div>
  <div id="impStep2"></div>`;
}
function impParse(){
  var f=$('impFile').files[0]; if(!f)return;
  if(typeof XLSX==='undefined'){ alert('La librería de Excel no cargó (revisá internet).'); return; }
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(!data.length){ $('impStep2').innerHTML='<div class="empty">El Excel está vacío</div>'; return; }
      impHeaders=data[0].map(function(h){return String(h||'').trim();});
      impRows=data.slice(1).filter(function(r){return r.some(function(c){return String(c||'').trim();});});
      impMap={}; IMP_FIELDS.forEach(function(fd){ var idx=impHeaders.findIndex(function(h){var hl=h.toLowerCase();return hl.includes(fd[0])||(fd[0]==='phone'&&/tel|cel|n[uú]mero/.test(hl))||(fd[0]==='empresa'&&/empresa|cliente|nombre/.test(hl))||(fd[0]==='ban'&&/ban/.test(hl))||(fd[0]==='monthly_value'&&/mensual|costo|precio|\$/.test(hl))||(fd[0]==='contract_end_date'&&/venc|fecha/.test(hl))||(fd[0]==='plan'&&/plan/.test(hl))||(fd[0]==='status'&&/estado|status/.test(hl));}); impMap[fd[0]]=idx; });
      renderImpStep2();
    }catch(err){ $('impStep2').innerHTML='<div class="empty">No se pudo leer: '+err.message+'</div>'; }
  };
  rd.readAsArrayBuffer(f);
}
function renderImpStep2(){
  var opts=function(sel){ return '<option value="-1">— ninguna —</option>'+impHeaders.map(function(h,i){return '<option value="'+i+'"'+(i===sel?' selected':'')+'>'+(h||('col '+(i+1)))+'</option>';}).join(''); };
  var maprows=IMP_FIELDS.map(function(fd){ return '<div class="irow"><span>'+fd[1]+'</span><select class="inp" style="max-width:240px" onchange="impMap[\''+fd[0]+'\']=Number(this.value)">'+opts(impMap[fd[0]])+'</select></div>'; }).join('');
  var prev=impRows.slice(0,5).map(function(r){ return '<tr>'+IMP_FIELDS.map(function(fd){ var ix=impMap[fd[0]]; return '<td>'+(ix>=0?(r[ix]||''):'')+'</td>'; }).join('')+'</tr>'; }).join('');
  $('impStep2').innerHTML='<div class="panel"><h3>2) Mapeá las columnas</h3>'+maprows+'</div>'
    +'<div class="panel"><h3>3) Vista previa ('+impRows.length+' filas)</h3><div class="card" style="overflow-x:auto"><table style="min-width:760px"><thead><tr>'+IMP_FIELDS.map(function(fd){return '<th>'+fd[1]+'</th>';}).join('')+'</tr></thead><tbody>'+prev+'</tbody></table></div>'
    +'<button class="btn green" style="width:100%;margin-top:14px" onclick="impAplicar()">Aplicar a '+impRows.length+' filas</button></div>';
}
async function impAplicar(){
  if(!impRows.length){ alert('Subí un Excel primero'); return; }
  if(!confirm('¿Aplicar a '+impRows.length+' filas? El archivo actualiza/crea registros reales.'))return;
  var rows=impRows.map(function(r){ var o={}; IMP_FIELDS.forEach(function(fd){ var ix=impMap[fd[0]]; o[fd[0]]=ix>=0?r[ix]:''; }); return o; });
  try{ var res=await api('/api/import/apply',{method:'POST',body:{rows:rows}});
    alert('✓ Importado:\n• Clientes creados: '+res.clientes_creados+'\n• BANs creados: '+res.bans_creados+'\n• Suscriptores creados: '+res.subs_creados+'\n• Suscriptores actualizados: '+res.subs_actualizados+'\n• Omitidas: '+res.omitidas+((res.errores&&res.errores.length)?('\n• Errores: '+res.errores.length):'')); }
  catch(e){ alert('No se pudo importar: '+e.message); }
}

// ---------------- ROUTER ----------------
async function router(){
  const h=(location.hash.slice(1)||'/clientes').split('/').filter(Boolean);
  const [route,arg]=h;
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.getAttribute('href')==='#/'+route));
  $('view').innerHTML='<div class="empty">Cargando…</div>';
  try{
    let html='';
    if(route==='clientes')html=await viewClientes();
    else if(route==='cliente')html=await viewCliente(arg);
    else if(route==='asana')html=await viewAsana();
    else if(route==='opp')html=await viewOpp(arg);
    else if(route==='comisiones')html=await viewComisiones();
    else if(route==='metas')html=await viewMetas();
    else if(route==='panel')html=await viewPanel();
    else if(route==='pasos')html=await viewPasos(arg);
    else if(route==='pendientes')html=await viewPendientes();
    else if(route==='categorias')html=await viewCategorias();
    else if(route==='historial')html=await viewHistorial();
    else if(route==='perfil')html=await viewPerfil();
    else if(route==='comparativa')html=await viewComparativa();
    else if(route==='config')html=await viewConfig();
    else if(route==='correos')html=await viewCorreos();
    else if(route==='campanas')html=await viewCampanas();
    else if(route==='import')html=await viewImport();
    else html=await viewClientes();
    $('view').innerHTML=html;
  }catch(e){$('view').innerHTML='<div class="empty">Error: '+e.message+'</div>';}
}
window.addEventListener('hashchange',router);

// ---------------- SESIÓN / LOGIN (Tango V2) ----------------
function setSession(t,u){ token=t; currentUser=u; try{localStorage.setItem('vp_token',t);localStorage.setItem('vp_user',JSON.stringify(u||{}));}catch(e){} }
function clearSession(){ token=null; currentUser=null; try{localStorage.removeItem('vp_token');localStorage.removeItem('vp_user');}catch(e){} }
function logout(){ clearSession(); showLogin(); }
function connOk(){ $('conn').className='conn ok'; $('conn').textContent='✓ '+((currentUser&&currentUser.nombre)?currentUser.nombre:'conectado'); }
function showLogin(msg){
  if($('loginBg')) return;
  document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="loginBg" style="z-index:200"><div class="modal" style="max-width:380px">
    <div class="brand" style="justify-content:center;color:var(--txt);margin-bottom:4px"><span class="logo">V</span> VentasPro</div>
    <div class="s" style="text-align:center;margin-bottom:16px">Ingresá con tu usuario de Tango</div>
    <div class="flbl">Usuario</div><input class="inp" id="lg_user" style="margin-bottom:10px">
    <div class="flbl">Contraseña</div><input class="inp" id="lg_pass" type="password" style="margin-bottom:14px" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="lg_err" style="color:var(--red);font-size:12.5px;min-height:16px;margin-bottom:8px">${msg||''}</div>
    <button class="btn" style="width:100%" onclick="doLogin()">Entrar con Claro (Tango)</button>
    <div style="text-align:center;margin:12px 0 6px;color:var(--txt3);font-size:11px">— o para probar en esta PC —</div>
    <button class="btn ghost" style="width:100%" onclick="devEntrar()">Entrar en modo demo (local)</button>
    <div class="s" style="text-align:center;margin-top:10px;font-size:11px">El login de Claro funciona en el servidor. En tu PC, Tango bloquea por IP — usá el modo demo.</div>
  </div></div>`);
  setTimeout(()=>{var u=$('lg_user');if(u)u.focus();},60);
}
async function doLogin(){
  const usuario=($('lg_user').value||'').trim(), password=$('lg_pass').value||'';
  if(!usuario||!password){ $('lg_err').textContent='Poné usuario y contraseña'; return; }
  $('lg_err').textContent='Entrando…';
  try{
    const r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario,password})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ $('lg_err').textContent=d.error||'No se pudo entrar'; return; }
    setSession(d.token,d.user); var bg=$('loginBg'); if(bg)bg.remove(); connOk(); router();
  }catch(e){ $('lg_err').textContent='No conecta al backend'; }
}
async function devEntrar(){
  try{ const r=await fetch(API+'/api/auth/dev-login',{method:'POST'}); if(!r.ok){$('lg_err').textContent='Modo demo no disponible (producción)';return;} const d=await r.json(); setSession(d.token,d.user); var bg=$('loginBg'); if(bg)bg.remove(); connOk(); router(); }
  catch(e){ $('lg_err').textContent='Modo demo no disponible'; }
}
async function init(){
  // Login DESACTIVADO por ahora (hasta deploy): entra solo en local con dev-login.
  // En prod (sin dev-login) este intento falla -> ahí sí aparece el login de Claro.
  let t=null,u=null; try{ t=localStorage.getItem('vp_token'); u=JSON.parse(localStorage.getItem('vp_user')||'null'); }catch(e){}
  if(t){ token=t; currentUser=u;
    try{ const me=await fetch(API+'/api/me',{headers:{Authorization:'Bearer '+t}}); if(me.ok){ currentUser=(await me.json()).user; connOk(); router(); return; } }catch(e){}
    clearSession();
  }
  try{ const r=await fetch(API+'/api/auth/dev-login',{method:'POST'}); if(r.ok){ const d=await r.json(); setSession(d.token,d.user); connOk(); router(); return; } }catch(e){}
  $('conn').textContent='—'; showLogin();
}
init();
