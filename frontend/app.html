<script>
const API=''; // mismo origen: funciona en localhost:4000 y en el servidor (sin hardcodear host)
let token=null, currentUser=null;
const $=(id)=>document.getElementById(id);
function isSellerProfile(){return String(currentUser&&currentUser.rol||'').trim().toLowerCase()==='vendedor';}
function applySellerProfile(){
  const allowed=new Set(['panel','clientes','asana','comisiones','correos','perfil']);
  document.querySelectorAll('.nav[href^="#/"]').forEach(a=>{
    const route=a.getAttribute('href').slice(2);
    a.style.display=isSellerProfile()&&!allowed.has(route)?'none':'';
  });
  if(isSellerProfile())coMode='one';
}
function tog(){
  const b=document.body,current=b.getAttribute('data-theme')||'soft-dark';
  const next=current==='soft-dark'?'day':current==='day'?'dark':'soft-dark';
  b.setAttribute('data-theme',next);
  $('tgt').textContent=next==='day'?'Modo noche':next==='dark'?'Noche suave':'Modo día';
}
function money(n){return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function ini(n){return (n||'--').trim().slice(0,2).toUpperCase();}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function normalizePhone(value){const digits=String(value??'').replace(/\D/g,'');return digits.length===10?digits:String(value??'').trim();}
function fmtPhone(value){const digits=String(value??'').replace(/\D/g,'');return digits.length===10?digits.slice(0,3)+'-'+digits.slice(3,6)+'-'+digits.slice(6):String(value??'').trim();}
const formatContactValue=(label,value)=>/Tel\.|Celular/.test(label)?fmtPhone(value):value;
async function api(p,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+token};if(opts.body&&typeof opts.body!=='string'){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body);}const r=await fetch(API+p,opts);if(r.status===401){clearSession();showLogin('Tu sesión venció, entrá de nuevo');throw new Error('401');}if(!r.ok&&r.status!==409){let msg='';try{const d=await r.json();msg=d&&d.error?': '+d.error:'';}catch(e){}throw new Error(p+' -> '+r.status+msg);}return r.json();}
async function apiForm(p,formData){const r=await fetch(API+p,{method:'POST',headers:{Authorization:'Bearer '+token},body:formData});if(r.status===401){clearSession();showLogin('Tu sesión venció, entrá de nuevo');throw new Error('401');}return r.json();}
function monthStart(){const m=new Date();return m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-01';}

// ---------------- VIEWS ----------------
// ---- Clientes: estado de pantalla (tab + búsqueda + página) ----
let cliTab='all', cliQ='', cliPage=1, cliServiceFilter='todas', cliRenewalFilter='', cliSearchTimer=null, cliStatsCache=null, cliStatsLoading=false, cliSearchCursor=0, cliSearchVersion=0;
const CLI_TABS=[['all','Todos'],['active','Activos'],['cancelled','Cancelados'],['following','Seguimiento'],['incomplete','Incompletos']];
const CLI_PILL={all:'violet',active:'green',cancelled:'red',following:'violet',incomplete:'amber'};
async function reClientes(){ const version=cliSearchVersion; const html=await viewClientes(); if(version!==cliSearchVersion)return; $('view').innerHTML=html; cliRestoreSearchFocus(); }
async function cliLoadStats(){
  if(cliStatsLoading)return; cliStatsLoading=true;
  try{ var r=await api('/api/clients-real/stats'); if(r&&r.stats)cliStatsCache=r.stats; if(location.hash==='#/clientes'||!location.hash)reClientes(); }
  catch(e){} finally{ cliStatsLoading=false; }
}
function setCliTab(t){ clearTimeout(cliSearchTimer); cliTab=t; cliQ=''; cliRenewalFilter=''; if(t!=='active')cliServiceFilter='todas'; cliPage=1; reClientes(); }
function setCliServiceFilter(t){ cliServiceFilter=t; cliRenewalFilter=''; cliPage=1; reClientes(); }
function setCliRenewalFilter(t){ cliTab='active'; cliServiceFilter='todas'; cliRenewalFilter=t; cliPage=1; reClientes(); }
function cliSearch(ev){ if(ev.key==='Enter'){ clearTimeout(cliSearchTimer); cliQ=ev.target.value.trim(); cliSearchCursor=cliQ.length; cliSearchVersion++; cliPage=1; reClientes(); } }
function cliSearchNow(v,el){ cliQ=String(v||'').trim(); cliSearchCursor=el&&typeof el.selectionStart==='number'?el.selectionStart:String(v||'').length; cliSearchVersion++; cliPage=1; clearTimeout(cliSearchTimer); if(!cliQ){ reClientes(); return; } cliSearchTimer=setTimeout(() => reClientes(), 220); }
function cliRestoreSearchFocus(){ if(location.hash&&location.hash!=='#/clientes')return; var restore=function(){ var i=$('cliSearchInput'); if(!i)return; var pos=Math.min(cliSearchCursor||String(cliQ||'').length,String(cliQ||'').length); i.focus(); try{i.setSelectionRange(pos,pos);}catch(e){} }; setTimeout(restore,0); setTimeout(restore,60); }
function cliPageGo(d){ cliPage+=d; reClientes(); }
function cliClientServiceType(client){
  const movil=Number(client&&client.mobile_new_count||0)+Number(client&&client.mobile_ren_count||0)>0;
  const mpls=Number(client&&client.mpls_count||0)>0;
  const fijo=Number(client&&client.fixed_new_count||0)+Number(client&&client.fixed_ren_count||0)>0||mpls;
  const claroTv=Number(client&&client.claro_tv_count||0)>0;
  const cloud=Number(client&&client.cloud_count||0)>0;
  const activeFamilies=[movil,fijo,claroTv,cloud].filter(Boolean).length;
  if(activeFamilies>1)return 'convergente';
  if(movil)return 'movil';
  if(fijo)return 'fijo';
  return '';
}
function cliBanSummary(c){
  const bans=String(c&&c.ban_numbers||'').split(',').map(x=>x.trim()).filter(Boolean);
  return [...new Set(bans)].slice(0,8).join(', ');
}
function fmtDate(d){ if(!d) return '—'; const x=new Date(d); if(isNaN(x)) return '—'; return x.toLocaleDateString('es-PR',{day:'numeric',month:'numeric',year:'numeric'}); }
function vencBadge(d){ if(!d) return ''; const days=Math.floor((new Date(d)-new Date())/86400000); if(isNaN(days)) return ''; if(days<0) return `<div class="pill red" style="margin-top:3px;font-size:10px">Vencido hace ${-days} días</div>`; if(days<=60) return `<div class="pill amber" style="margin-top:3px;font-size:10px">Vence en ${days} días</div>`; return ''; }

async function viewClientes(){
  const searchScope=cliQ?'all':cliTab;
  const service=(cliTab==='active'||cliTab==='all'||cliQ)?cliServiceFilter:'todas';
  const per=50;
  const d=await api(`/api/clients-real?tab=${searchScope}&q=${encodeURIComponent(cliQ)}&service=${service}&renewal=${cliRenewalFilter}&summary=0&page=${cliPage}&per=${per}`);
  if(d.stats) cliStatsCache=d.stats;
  if(!cliStatsCache&&!cliStatsLoading&&!cliQ)cliLoadStats();
  const st=d.stats||cliStatsCache||{}, lm=st.line_metrics||{};
  const counts={active:st.active_count,cancelled:st.cancelled_count,following:st.following_count,incomplete:st.incomplete_count};
  const totalClients=Number(counts.active||0)+Number(counts.cancelled||0)+Number(counts.following||0)+Number(counts.incomplete||0);
  const amount=v=>Number(v)>0?money(v):'';
  const metric=(label,value,monthly)=>`<div style="display:flex;justify-content:space-between;gap:10px"><span>${label} <b>${value||0}</b></span>${monthly?`<span style="color:var(--green)">${monthly}</span>`:''}</div>`;
  const active=lm.active||{}, cancelled=lm.cancelled||{}, following=lm.following||{}, incomplete=lm.incomplete||{};
  const cards=[
    ['all','Todos',totalClients,'Todo el CRM',[
      metric('Activos',counts.active),
      metric('Cancelados',counts.cancelled),
      metric('Seguimiento',counts.following),
      metric('Incompletos',counts.incomplete)
    ]],
    ['active','Activas',active.active_lines_count||0,'Líneas activas',[
      metric('Móvil',active.mobile_lines,amount(active.mobile_monthly_value)),
      metric('Fijo',active.fixed_lines,amount(active.fixed_monthly_value)),
      metric('Sin clasificar',active.incomplete_lines),
      active.suspended_lines?`Suspendidas: <b>${active.suspended_lines}</b> incluidas arriba`:''
    ]],
    ['cancelled','Canceladas',st.cancelled_lines_count||0,'Líneas canceladas',[
      `Clientes con cartera cancelada: <b>${counts.cancelled??0}</b>`,
      'Sin precios ni clasificación comercial en este resumen.'
    ]],
    ['following','Seguimiento',counts.following??0,'Clientes en seguimiento',[
      metric('Líneas activas',following.active_lines_count),
      metric('Móvil',following.mobile_lines,amount(following.mobile_monthly_value)),
      metric('Fijo',following.fixed_lines,amount(following.fixed_monthly_value))
    ]],
    ['incomplete','Incompletas',counts.incomplete??0,'Clientes para completar',[
      metric('Líneas activas',incomplete.active_lines_count),
      metric('Móvil',incomplete.mobile_lines),
      metric('Fijo',incomplete.fixed_lines),
      metric('Sin clasificar',incomplete.incomplete_lines)
    ]]
  ];
  const card=([t,label,total,totalLabel,details])=>`<div class="kpi click cli-kpi-${t}${cliTab===t?' on':''}" onclick="setCliTab('${t}')">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="l">${label}</span><span class="pill ${CLI_PILL[t]}">${totalLabel}</span></div>
    <div class="v">${Number(total||0).toLocaleString('en-US')}</div>
    <div class="bk">${details.filter(Boolean).join('')}</div></div>`;
  const listed=d.clients||[];
  const all=listed;
  const serviceCounts=st.service_counts||{};
  const showServiceFilters=cliTab==='active'||cliTab==='all'||!!cliQ;
  const serviceFilterLabel=(cliTab==='all'||cliQ)?'Filtrar resultados por servicio':'Clientes activos por servicio';
  const serviceTabs=[
    ['todas','Todas'],['movil','Móvil'],['fijo','Fijo'],['convergente','Convergente']
  ].map(([value,label])=>`<button class="btn ${cliServiceFilter===value?'':'ghost'}" data-client-service-tab="${value}" style="padding:8px 13px;font-size:13px" onclick="setCliServiceFilter('${value}')">${label} <b>${serviceCounts[value]??0}</b></button>`).join('');
  const renewal=st.renewal_alert||{};

function ocrReadFileAsDataUrl(file){
  return new Promise(function(resolve,reject){
    var rd=new FileReader();
    rd.onload=function(ev){resolve(ev.target.result);};
    rd.onerror=function(){reject(new Error('No se pudo leer la imagen'));};
    rd.readAsDataURL(file);
  });
}
async function ocrImageToReadableDataUrl(source,mime){
  var dataUrl=typeof source==='string'?source:await ocrReadFileAsDataUrl(source);
  return new Promise(function(resolve){
    var img=new Image();
    img.onload=function(){
      var scale=Math.min(4,Math.max(1,1100/Math.max(img.naturalWidth,img.naturalHeight)));
      if(scale<=1){resolve({dataUrl:dataUrl,mime:mime||'image/png'});return;}
      var canvas=document.createElement('canvas');
      canvas.width=Math.round(img.naturalWidth*scale);
      canvas.height=Math.round(img.naturalHeight*scale);
      var ctx=canvas.getContext('2d');
      ctx.imageSmoothingEnabled=false;
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      resolve({dataUrl:canvas.toDataURL('image/png'),mime:'image/png'});
    };
    img.onerror=function(){resolve({dataUrl:dataUrl,mime:mime||'image/png'});};
    img.src=dataUrl;
  });
}
function ocrPasteImage(e){
  var items=(e.clipboardData&&e.clipboardData.items)||[];
  for(var i=0;i<items.length;i++){
    if(items[i].type&&items[i].type.indexOf('image/')===0){
      e.preventDefault();
      var file=items[i].getAsFile();
      var rd=new FileReader();
      rd.onload=function(ev){ ocrPastedImage={dataUrl:ev.target.result,mime:file.type||'image/png'}; var inp=$('ocrFile'); if(inp)inp.value=''; ocrSetPreview(ev.target.result,'Imagen pegada desde portapapeles'); };

      if(resp.status===409){ fail++; errs.push(ph+': '+(out.error||'ya existe en otro BAN')); continue; }
      if(!resp.ok) throw new Error(out.error||('HTTP '+resp.status));
      ok++; if(out&&out.inserted)created++; else { updated++; var ps=String((out&&out.previous_status)||'').toLowerCase(); if(ps.includes('cancel')||ps==='c'||ps.includes('inactivo'))reactivated++; }
    }catch(e){ fail++; errs.push(ph+': '+e.message); } }
  cerrarOCR(); refreshCli(); alert('Procesados: '+ok+' · nuevos: '+created+' · actualizados: '+updated+(reactivated?(' · reactivados desde cancelado: '+reactivated):'')+(fail?(' · fallaron: '+fail+(errs.length?('\\n'+errs.slice(0,4).join('\\n')):'')):''));
}

// Excel con identidad Claro: .xlsx nativo, sin avisos de formato al abrirlo.
async function compExcelClaro(){
  const c=compCli, act=(c.subscribers||[]).filter(s=>cliAct(s.status)), t=compTotals();
  const banOrder=compBanOrder(act), banCount=compBanCount(act);
  const notas=String($('compNotas')?.value||'').trim();
  const MONEDA='$#,##0.00';
  const relleno=h=>({type:'pattern',pattern:'solid',fgColor:{argb:h}});
  const linea={style:'thin',color:{argb:'FFD9E1F2'}};
  const borde={top:linea,left:linea,bottom:linea,right:linea};
  const wb=new ExcelJS.Workbook();
  wb.creator='CRM Claro Empresas'; wb.created=new Date();
  const ws=wb.addWorksheet('Comparativa',{views:[{showGridLines:false}],pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}});
  ws.columns=[{width:24},{width:16},{width:26},{width:14},{width:26},{width:12}];
  const fila=(valores,estilo)=>{
    const r=ws.addRow(valores);
    if(estilo&&estilo.alto) r.height=estilo.alto;
    r.eachCell({includeEmpty:true},cel=>{
      cel.border=borde;
      if(estilo&&estilo.fondo) cel.fill=relleno(estilo.fondo);
      if(estilo&&estilo.fuente) cel.font=estilo.fuente;
    });
    return r;
  };
  const seccion=titulo=>{const r=fila([titulo,'','','','',''],{fondo:'FF111827',fuente:{bold:true,size:12,color:{argb:'FFFFB21C'}},alto:20});ws.mergeCells(r.number,1,r.number,6);return r;};
  const cabecera=celdas=>fila(celdas,{fondo:'FF252F53',fuente:{bold:true,size:10,color:{argb:'FFFFB21C'}},alto:18});
  const total=(etiqueta,valor,extra,color)=>{const r=fila(['','',etiqueta,Number(valor||0),extra||'',''],{fondo:'FFFFF7ED',fuente:{bold:true}});r.getCell(4).numFmt=MONEDA;r.getCell(4).font={bold:true,color:{argb:color}};return r;};

  const titulo=fila(['Comparativa de Planes','','','','',''],{fondo:'FF1F2A44',fuente:{bold:true,size:16,color:{argb:'FFFFB21C'}},alto:30});
  ws.mergeCells(titulo.number,1,titulo.number,6);
  fila(['Cliente',c.name||'','','','Fecha',new Date().toLocaleDateString('es-PR')],{fondo:'FFF8FAFC',fuente:{bold:true,color:{argb:'FF334155'}}});
  ws.addRow([]);

  seccion('Plan actual del cliente');
  cabecera(['BAN','Teléfono','Plan','Costo','Vencimiento','']);
  if(act.length){ act.forEach(s=>{ const r=fila([compBanDisplay(s,banOrder),fmtPhone(s.phone)||'',s.plan||'',Number(s.monthly_value||0),compEndDate(s),'']); r.getCell(4).numFmt=MONEDA; }); }
  else fila(['Sin líneas activas','','','','','']);
  total('Total actual',t.totalAct,banCount?('Actual '+banCount+' cuenta'+(banCount===1?'':'s')):'','FF009F6E');
  ws.addRow([]);

  seccion('Oferta propuesta');
  cabecera(['BAN','Teléfono','Plan nuevo','Costo','Notas','']);
  if(compOffer.length){ compOffer.forEach(o=>{ const r=fila([o.ban||'',fmtPhone(o.phone)||'',o.plan||'',Number(o.cost||0),o.notes||'','']); r.getCell(4).numFmt=MONEDA; }); }
  else fila(['Sin líneas en la oferta','','','','','']);
  total('Total oferta',t.totalOf,'','FF2563EB');
  total('Diferencia',t.diff,'',Number(t.diff||0)<=0?'FF009F6E':'FFD71920');
  ws.addRow([]);

  seccion('Notas');
  const rNotas=fila([notas||'Sin notas generales','','','','',''],{fondo:'FFFFF7F7',fuente:{color:{argb:'FF7F1D1D'}},alto:34});
  ws.mergeCells(rNotas.number,1,rNotas.number,6);
  rNotas.getCell(1).alignment={wrapText:true,vertical:'middle'};
  rNotas.getCell(1).border={top:linea,bottom:linea,right:linea,left:{style:'medium',color:{argb:'FFD71920'}}};

  const buffer=await wb.xlsx.writeBuffer();
  compDescargar(new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),compExcelNombre()+'.xlsx');
}

function parseVoz(t){
  const low=(t||'').toLowerCase();
  const digits=((t||'').match(/\d/g)||[]).join('');
  const groups=((t||'').match(/\d[\d\s().-]{7,}\d/g)||[]).map(x=>x.replace(/\D/g,''));
  const ban=(groups.find(x=>x.length===9)||'');
  const subscriber=(groups.find(x=>x.length===10&&/^(787|939|989)/.test(x))||'');
  const pm=digits.match(/(787|939|989)\d{7}/); const telefono=subscriber||(pm?pm[0]:'');
  const prodMap=[['fijo ren','fijo_ren'],['fijo renov','fijo_ren'],['fijo new','fijo_new'],['fijo nuev','fijo_new'],['movil ren','movil_ren'],['móvil ren','movil_ren'],['movil renov','movil_ren'],['móvil renov','movil_ren'],['movil new','movil_new'],['móvil new','movil_new'],['movil nuev','movil_new'],['móvil nuev','movil_new'],['claro tv','claro_tv'],['cloud','cloud'],['mpls','mpls']];
  let product_key=''; for(const[k,v]of prodMap){ if(low.includes(k)){product_key=v;break;} }
  let empresa=''; const em=t&&t.match(/(?:empresa|cliente|negocio)\s+([a-zA-ZáéíóúñÑ0-9 .&'-]+?)(?:\s+(?:tel[eé]fono|telefono|fijo|m[oó]vil|movil|claro|cloud|mpls|n[uú]mero|quiere|son|de)\b|[,.]|$)/i); if(em)empresa=em[1].trim();
  let qty=''; const qm=low.match(/(\d+)\s*(l[ií]neas?|m[oó]viles?|fijos?|tv|equipos?|cuentas?)/); if(qm)qty=qm[1];
  let monto=''; const mm=t&&t.match(/\$\s*([0-9]+(?:[.,][0-9]+)?)/); if(mm)monto=mm[1].replace(',','');
  return {empresa,ban,subscriber:telefono,product_key,qty,monto};
}

function metaMonthsList(alcance, base){
  const d=new Date(base), y=d.getFullYear(), m0=d.getMonth(), out=[];
  if(alcance==='anio'){ for(let m=0;m<12;m++) out.push(y+'-'+String(m+1).padStart(2,'0')+'-01'); }
  else if(alcance==='dic'){ for(let m=m0;m<12;m++) out.push(y+'-'+String(m+1).padStart(2,'0')+'-01'); }
  else out.push(base);
  return out;
}
async function guardarMeta(scope, salesperson, rk){
  const prods=window.__metaProds||[];
  const sel=$('sc_'+rk); const meses=metaMonthsList(sel?sel.value:'mes', metaMonth);
  try{
    for(const p of prods){
      const inp=$('m_'+rk+'_'+p.key); const qty=Number(inp?inp.value:0)||0;
      for(const mo of meses){ await api('/api/goals',{method:'POST',body:{scope, salesperson:salesperson||null, product_key:p.key, month:mo, target_qty:qty}}); }
    }
    alert('✓ Meta guardada'+(meses.length>1?(' ('+meses.length+' meses)'):''));
  }catch(e){ alert('No se pudo guardar: '+e.message); }
}

function ofLatestByDate(items,dateFields){
  return (items||[]).slice().sort(function(a,b){
    if((a&&a.numero!=null)||(b&&b.numero!=null)){
      var an=Number(a&&a.numero||0), bn=Number(b&&b.numero||0);
      if(an!==bn)return bn-an;
    }
    var av=dateFields.filter(function(f){return f!=='numero';}).map(function(f){return a&&a[f];}).find(Boolean)||'';
    var bv=dateFields.filter(function(f){return f!=='numero';}).map(function(f){return b&&b[f];}).find(Boolean)||'';
    return String(bv).localeCompare(String(av));
  })[0]||null;
}

function ovDetectarVigenciaHasta(files){
  var months={enero:'01',febrero:'02',marzo:'03',abril:'04',mayo:'05',junio:'06',julio:'07',agosto:'08',septiembre:'09',setiembre:'09',octubre:'10',noviembre:'11',diciembre:'12'};
  for(var i=0;i<files.length;i++){
    var source=String(files[i].name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    var year=(source.match(/20\d{2}/)||[])[0]||'';
    var desdeMatch=source.match(/desde\s+(\d{1,2})\s+de\s+([a-z]+)\s+de\s+(20\d{2})/);
    if(desdeMatch&&months[desdeMatch[2]])return desdeMatch[3]+'-'+months[desdeMatch[2]]+'-'+String(desdeMatch[1]).padStart(2,'0');
    var rangoMes=source.match(/(?:del|vigencia|valido del)?\s*(\d{1,2})\s+(?:al|a|-)\s+(\d{1,2})\s+de?\s*([a-z]+)\s+de?\s*(20\d{2})/);
    if(rangoMes&&months[rangoMes[3]])return rangoMes[4]+'-'+months[rangoMes[3]]+'-'+String(rangoMes[2]).padStart(2,'0');
    var same=source.match(/(?:al|hasta)\s+(\d{1,2})\s+de\s+([a-z]+)/);
    if(year&&same&&months[same[2]])return year+'-'+months[same[2]]+'-'+String(same[1]).padStart(2,'0');
    var numeric=source.match(/(?:al|hasta|-)\s*(\d{1,2})[-_ ](\d{1,2})[-_ ](20\d{2})/);
    if(numeric)return numeric[3]+'-'+String(numeric[2]).padStart(2,'0')+'-'+String(numeric[1]).padStart(2,'0');
    var compact=source.match(/(20\d{2})(\d{2})(\d{2})/);
    if(compact)return compact[1]+'-'+compact[2]+'-'+compact[3];
  }
  return '';
}

  if(/formato_base_pdf_invalido/.test(m))return 'Este catalogo base requiere el PDF oficial. Las tablas Excel van en Lista de Precios u Ofertas Vigentes segun corresponda.';

  if(/^(?:HTTP\s+)?403\b|->\s*403\b/.test(m))return 'No tenés permiso administrativo para esta acción.';

function fcRenderBasePreviewBody(){

  var diff=preview.diferencias&&preview.diferencias.registros;
  if(!diff)return '<div class="empty">No se pudo comparar con la version publicada.</div>';
  function value(v){if(v==null)return '—';if(typeof v==='object')return Object.entries(v).map(function(pair){return pair[0]+': '+value(pair[1]);}).join(', ');return String(v);}
  function row(type,item,before,after){return '<tr><td>'+esc(type)+'</td><td>'+esc(item)+'</td><td>'+esc(value(before))+'</td><td>'+esc(value(after))+'</td></tr>';}
  function label(record){return [record.codigo,record.descripcion].filter(Boolean).join(' · ');}
  var changes=[];
  (diff.nuevos||[]).forEach(function(item){changes.push(row('Nuevo',label(item.registro),null,item.registro.precio_texto||item.registro.precio));});
  (diff.modificados||[]).forEach(function(item){(item.cambios||[]).forEach(function(change){changes.push(row('Cambio',item.codigo+' · '+change.campo.replace(/_/g,' '),change.antes,change.ahora));});});
  (diff.eliminados||[]).forEach(function(item){changes.push(row('Eliminado',label(item.registro),item.registro.precio_texto||item.registro.precio,null));});
  var blocked=preview.publicable?'':'<p>No se puede publicar: hay datos que requieren revision.</p>';
  if(!changes.length)return blocked+'<p>Sin cambios respecto a la version publicada.</p>';
  return blocked+'<p>'+((diff.nuevos||[]).length)+' nuevos · '+((diff.modificados||[]).length)+' modificados · '+((diff.eliminados||[]).length)+' eliminados</p><div style="overflow:auto"><table><thead><tr><th>Cambio</th><th>Elemento</th><th>Antes</th><th>Ahora</th></tr></thead><tbody>'+changes.join('')+'</tbody></table></div>';
}

  }catch(e){ el.innerHTML='<div class="empty">No se pudo cargar: '+e.message+'</div>'; }

async function eqBuscarFoto(id, btn){

  }).join('');

  var aplicable=(r.resumen||[]).some(function(s){return s.modulo_id;});

      impMap={}; var taken={}; IMP_FIELDS.forEach(function(fd){ var idx=-1; for(var i=0;i<impHeaders.length;i++){ if(!taken[i]&&impAutoDetect(impHeaders[i].toLowerCase(),fd[0])){ idx=i; break; } } if(idx>=0){ impMap[fd[0]]=idx; taken[idx]=1; } });

  };

function impCsv(v){ var s=String(v==null?'':v); return '"'+s.replace(/"/g,'""')+'"'; }
function impDescargarDetalle(){
  if(!impLastApplyResult){ return; }

    return (d.cambios||[]).map(function(c){ return [d.fila,d.accion,d.BAN,d.suscriptor,c.entidad||'',c.campo,c.anterior,c.nuevo]; });
  });
  var errors=(impLastApplyResult.errores||[]).map(function(e){ return [e.fila,'error','','','','',e.error,'']; });
  var csv=[['Fila','Acción','BAN','Suscriptor','Entidad','Campo','Anterior','Nuevo']].concat(rows,errors).map(function(r){return r.map(impCsv).join(',');}).join('\r\n');
  var url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  var a=document.createElement('a'); a.href=url; a.download='detalle-importacion-'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); URL.revokeObjectURL(url);
