<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claro Business - Claro TV PYMES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%);min-height:100vh;color:#e2e8f0}
.header{background:rgba(220,38,38,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.1);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.brand-logo{font-size:24px;font-weight:900;letter-spacing:-1px;color:#fff}
.brand-text{flex:1}.brand-title{font-size:15px;font-weight:800;color:#fff}.brand-sub{color:rgba(255,255,255,.82);font-size:12px;margin-top:1px}
.header-search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 14px}
.header-search input{background:none;border:none;outline:none;color:#fff;font-size:14px;width:230px}.header-search input::placeholder{color:rgba(255,255,255,.62)}
.nav{background:rgba(15,23,42,.7);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.06);padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.nav a{color:rgba(255,255,255,.64);font-size:13px;font-weight:600;padding:11px 14px;border-bottom:2px solid transparent;text-decoration:none;white-space:nowrap;transition:color .2s,border-color .2s}
.nav a:hover{color:#fff}.nav a.active{color:#38bdf8;border-bottom-color:#38bdf8}
.filters{padding:12px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.05)}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:rgba(255,255,255,.72);font-size:12px;font-weight:700;cursor:pointer}
.filter-btn.active{background:rgba(56,189,248,.18);border-color:rgba(56,189,248,.48);color:#38bdf8}
.filters-right{margin-left:auto;font-size:12px;color:rgba(255,255,255,.45)}
.container{max-width:1500px;margin:0 auto;padding:24px}
.section-card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:14px;margin-bottom:18px;overflow:hidden}
.section-header{padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;gap:16px}
.section-title{font-size:18px;font-weight:800;color:#f8fafc}.section-sub{font-size:12px;color:#38bdf8;font-weight:700;margin-top:4px}.section-desc{font-size:12px;color:rgba(255,255,255,.55);margin-top:6px}
.badge-note{font-size:10px;color:#facc15;background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.2);border-radius:20px;padding:4px 10px;white-space:nowrap;height:max-content}
.section-body{padding:18px 22px}.table-wrap{overflow-x:auto}.plan-table{width:100%;border-collapse:collapse;font-size:13px}
.plan-table th{text-align:left;padding:9px 12px;color:rgba(255,255,255,.55);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap}
.plan-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.045);vertical-align:middle}.plan-table tr:hover td{background:rgba(255,255,255,.035)}
.plan-table td.num,.plan-table th.num{text-align:right;white-space:nowrap}.desc{min-width:280px}.code{font-family:monospace;font-size:11px;background:rgba(56,189,248,.1);color:#7dd3fc;padding:2px 6px;border-radius:4px}.price{font-weight:900;color:#4ade80}.muted{color:rgba(255,255,255,.45)}mark{background:#fbbf2440;color:#fbbf24;border-radius:2px}
@media(max-width:720px){.header{flex-wrap:wrap}.header-search{width:100%}.header-search input{width:100%}.container{padding:12px}.section-header{flex-direction:column}.plan-table{font-size:12px}}
</style>
</head>
<body>
<header class="header">
  <div class="brand-logo">CLARO</div>
  <div class="brand-text">
    <div class="brand-title">Claro TV - Lista de precios</div>
    <div class="brand-sub" id="versionLabel">PYMES / Corporativo - Puerto Rico</div>
  </div>
  <div class="header-search">
    <input type="text" id="searchInput" placeholder="Buscar codigo, plan, precio...">
  </div>
</header>

<nav class="nav">
  <a href="index.html">Planes Fijos</a>
  <a href="claro-tv.html" class="active">Claro TV</a>
  <a href="movil.html">Planes Moviles</a>
  <a href="banda-ancha.html">Inalambrico / IoT</a>
  <a href="equipos.html">Lista de Equipos</a>
  <a href="servicios.html">Servicios</a>
  <a href="oferta-const.html">Oferta const.</a>
  <a href="ofertas.html">Ofertas</a>
</nav>

<div class="filters">
  <button class="filter-btn active" type="button" data-filter="all" onclick="setFilter('all',this)">Todos</button>
  <button class="filter-btn" type="button" data-filter="planes" onclick="setFilter('planes',this)">Planes TV</button>
  <button class="filter-btn" type="button" data-filter="premium" onclick="setFilter('premium',this)">Premium</button>
  <button class="filter-btn" type="button" data-filter="equipos" onclick="setFilter('equipos',this)">Equipos TV</button>
  <span class="filters-right" id="countLabel"></span>
</div>

<main class="container" id="mainContainer"></main>

<script>
const PLANES_CLARO_TV_DATA_FALLBACK = [
  {
    key:'planes',
    titulo:'Planes Claro TV',
    subtitulo:'Clarotv+ Negocios - precios base',
    descripcion:'Planes regulares de TV. Los descuentos promocionales y convergentes se manejan aparte.',
    filas:[
      {codigo:'PY2ULE',descripcion:'Clarotv+ ULTRA ESENCIAL (21c)',precio:15.99,alfa:'-',tecnologia:'COBRE/VRAD/GPON',activacion:'$40.00 en 12M / $0.00 en 24M',penalidad:'$200.00 prorrateado'},
      {codigo:'PY2ESE',descripcion:'Clarotv+ ESENCIAL (29c)',precio:19.99,alfa:'-',tecnologia:'COBRE/VRAD/GPON',activacion:'$40.00 en 12M / $0.00 en 24M',penalidad:'$200.00 prorrateado'},
      {codigo:'IP2ESTE',descripcion:'Clarotv+ ESENCIAL + TODO ESPANOL (68c)',precio:26.99,alfa:'-',tecnologia:'COBRE/VRAD/GPON',activacion:'$40.00 en 12M / $0.00 en 24M',penalidad:'$200.00 prorrateado'},
      {codigo:'IP2BASC2',descripcion:'Clarotv+ BASIC (76c)',precio:55.99,alfa:'-',tecnologia:'COBRE/VRAD/GPON',activacion:'$40.00 en 12M / $0.00 en 24M',penalidad:'$200.00 prorrateado'},
      {codigo:'IP2BASC3',descripcion:'Clarotv+ BASIC+ (98c)',precio:60.99,alfa:'-',tecnologia:'COBRE/VRAD/GPON',activacion:'$40.00 en 12M / $0.00 en 24M',penalidad:'$200.00 prorrateado'},
      {codigo:'PY2SIG',descripcion:'Clarotv+ SIGNATURE (147c)',precio:70.99,alfa:'-',tecnologia:'COBRE/VRAD/GPON',activacion:'$40.00 en 12M / $0.00 en 24M',penalidad:'$200.00 prorrateado'}
    ]
  },
  {
    key:'premium',
    titulo:'Canales premium',
    subtitulo:'Opciones adicionales de TV',
    descripcion:'Canales premium publicados en la lista de precios.',
    filas:[
      {codigo:'REAKNG',descripcion:'REALITY KING',precio:24.99,alfa:'-',tecnologia:'VRAD/GPON',activacion:'-',penalidad:'-'},
      {codigo:'IPLYB',descripcion:'PLAYBOY TV',precio:19.99,alfa:'-',tecnologia:'VRAD/GPON',activacion:'-',penalidad:'-'}
    ]
  },
  {
    key:'equipos',
    titulo:'Equipos Claro TV',
    subtitulo:'STB, Dongle, control y DVR',
    descripcion:'Equipos y cargos relacionados a TV. No mezclar con lista de equipos moviles.',
    filas:[
      {codigo:'40942H',descripcion:'1er STB gratis contrato 24 meses',precio:0,alfa:'2YROFF',tecnologia:'COBRE/VRAD/GPON',activacion:'-',penalidad:'$40.00'},
      {codigo:'40942H',descripcion:'1er STB gratis contrato 12 meses',precio:0,alfa:'1YROFF',tecnologia:'COBRE/VRAD/GPON',activacion:'-',penalidad:'$40.00'},
      {codigo:'40942H',descripcion:'STB full price clientes con contrato',precio:40,alfa:'CASH',tecnologia:'COBRE/VRAD/GPON',activacion:'-',penalidad:'-'},
      {codigo:'40942H',descripcion:'STB financiado 24 meses clientes con contrato',precio:40,alfa:'FINA24',tecnologia:'COBRE/VRAD/GPON',activacion:'$1.67 mensual',penalidad:'Restante de $40.00'},
      {codigo:'80105H',descripcion:'DONGLE 4K - full price clientes con/sin contrato',precio:30,alfa:'CASH',tecnologia:'COBRE/VRAD/GPON',activacion:'-',penalidad:'-'},
      {codigo:'80105H',descripcion:'DONGLE 4K - financiado 24M clientes c/contrato',precio:30,alfa:'FINA24',tecnologia:'COBRE/VRAD/GPON',activacion:'$1.25 mensual',penalidad:'Restante de $30.00'},
      {codigo:'40941H',descripcion:'1er control remoto gratis',precio:0,alfa:'CERO',tecnologia:'COBRE/VRAD/GPON',activacion:'-',penalidad:'$6.00'},
      {codigo:'40941H',descripcion:'2do control remoto en adelante (reemplazo)',precio:6,alfa:'CASH',tecnologia:'COBRE/VRAD/GPON',activacion:'-',penalidad:'-'},
      {codigo:'NPVR250',descripcion:'Cloud DVR (250GB) - 1 por cuenta, no por TV',precio:5,alfa:'NPVR250',tecnologia:'COBRE/VRAD/GPON',activacion:'-',penalidad:'-'}
    ]
  }
];
let PLANES_CLARO_TV_DATA = [];
let activeFilter='all';
function money(v){return Number(v)===0?'Gratis':'$'+Number(v).toFixed(2)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hl(s,q){s=String(s==null?'':s);if(!q)return esc(s);const i=s.toLowerCase().indexOf(q);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));}
function setFilter(key,btn){activeFilter=key;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function render(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  const grupos=PLANES_CLARO_TV_DATA.filter(g=>activeFilter==='all'||g.key===activeFilter);
  let count=0;
  document.getElementById('mainContainer').innerHTML=grupos.map(g=>{
    const rows=g.filas.filter(r=>!q||Object.values(r).some(v=>String(v).toLowerCase().includes(q)));
    count+=rows.length;
    return `<section class="section-card">
      <div class="section-header">
        <div><div class="section-title">${esc(g.titulo)}</div><div class="section-sub">${esc(g.subtitulo)}</div><div class="section-desc">${esc(g.descripcion)}</div></div>
        <span class="badge-note">Precio base</span>
      </div>
      <div class="section-body">
        <div class="table-wrap"><table class="plan-table">
          <thead><tr><th>Codigo</th><th>Descripcion</th><th class="num">Precio</th><th>Alfa Code</th><th>Tecnologia</th><th>Activacion</th><th>Penalidad</th></tr></thead>
          <tbody>${rows.map(r=>`<tr><td><span class="code">${esc(r.codigo)}</span></td><td class="desc">${hl(r.descripcion,q)}</td><td class="num"><span class="price">${money(r.precio)}</span></td><td>${esc(r.alfa)}</td><td>${esc(r.tecnologia)}</td><td>${esc(r.activacion)}</td><td>${esc(r.penalidad)}</td></tr>`).join('')}</tbody>
        </table></div>
      </div>
    </section>`;
  }).join('');
  document.getElementById('countLabel').textContent=count+' registros';
}
document.getElementById('searchInput').addEventListener('input',render);
function showUnavailable(reason){
  PLANES_CLARO_TV_DATA=[];
  document.getElementById('mainContainer').innerHTML='<section class="section-card"><div class="section-body" style="text-align:center;padding:42px"><div class="section-title">Información no disponible</div><div class="section-desc">'+esc(reason||'No existe una publicación vigente de Claro TV.')+'</div></div></section>';
  document.getElementById('countLabel').textContent='0 registros';
}
function buildFiltersFromModules(){
  const bar=document.querySelector('.filters');
  bar.querySelectorAll('[data-filter]:not([data-filter="all"])').forEach(b=>b.remove());
  const ref=bar.querySelector('.filters-right');
  PLANES_CLARO_TV_DATA.forEach(g=>{
    const btn=document.createElement('button');
    btn.className='filter-btn';
    btn.type='button';
    btn.dataset.filter=g.key;
    btn.textContent=g.titulo;
    btn.onclick=()=>setFilter(g.key,btn);
    bar.insertBefore(btn,ref);
  });
}
function moduleRows(modulo){
  return ((modulo.contenido||{}).filas||[]).map(r=>({
    codigo:r.codigo||'',
    descripcion:r.descripcion||'',
    precio:r.precio||0,
    alfa:r.alfa_code||r.alfa||'',
    tecnologia:r.tecnologia||'',
    activacion:r.activacion?JSON.stringify(r.activacion):'',
    penalidad:r.penalidad||''
  }));
}
async function loadClaroTv(){
  try{
    const r=await fetch('/api/planes-modulos/claro_tv');
    if(!r.ok)throw new Error('api');
    const data=await r.json();
    if(!data.publicacion)return showUnavailable('No existe una publicación vigente de Claro TV.');
    PLANES_CLARO_TV_DATA=(data.modulos||[]).map(m=>({key:m.seccion_key,titulo:m.titulo,subtitulo:m.subtitulo||'',descripcion:m.descripcion||'',filas:moduleRows(m)}));
    if(!PLANES_CLARO_TV_DATA.length)return showUnavailable('La publicación vigente no contiene módulos visibles.');
    document.getElementById('versionLabel').textContent='Versión '+(data.publicacion.numero||'')+' · Base actualizada '+String(data.publicacion.fecha_actualizacion_base||'').slice(0,10);
    buildFiltersFromModules();
    render();
  }catch(e){showUnavailable('No se pudo consultar la API de Claro TV. No se usaron datos estáticos antiguos.');}
}
loadClaroTv();
</script>
</body>
</html>
