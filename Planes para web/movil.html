<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claro Business - Planes Moviles PYMES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%);
  min-height:100vh;color:#e2e8f0;
}
.header{
  background:rgba(220,38,38,0.9);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.1);
  padding:14px 24px;display:flex;align-items:center;gap:16px;
  position:sticky;top:0;z-index:100;
}
.brand-logo{font-size:24px;font-weight:900;letter-spacing:-1px;color:#fff}
.brand-text{flex:1}
.brand-title{font-size:15px;font-weight:700;color:#fff}
.brand-sub{color:rgba(255,255,255,0.8);font-size:12px;margin-top:1px}
.header-search{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);
  border-radius:8px;padding:8px 14px;
}
.header-search input{background:none;border:none;outline:none;color:#fff;font-size:14px;width:200px}
.header-search input::placeholder{color:rgba(255,255,255,0.6)}

.nav{
  background:rgba(15,23,42,0.7);backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(255,255,255,0.06);
  padding:0 24px;display:flex;gap:4px;overflow-x:auto;
}
.nav a{
  color:rgba(255,255,255,0.6);font-size:13px;font-weight:500;
  padding:11px 14px;border-bottom:2px solid transparent;
  text-decoration:none;white-space:nowrap;transition:color .2s,border-color .2s;
}
.nav a:hover{color:#fff}
.nav a.active{color:#38bdf8;border-bottom-color:#38bdf8}

/* Toggle autopay */
.autopay-bar{
  background:rgba(15,23,42,0.6);
  padding:12px 24px;
  display:flex;align-items:center;gap:14px;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.toggle-wrap{display:flex;align-items:center;gap:8px;cursor:pointer}
.toggle-switch{
  width:40px;height:22px;border-radius:11px;
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.2);
  position:relative;transition:background .2s;cursor:pointer;
}
.toggle-switch.on{background:rgba(74,222,128,0.4);border-color:rgba(74,222,128,0.6)}
.toggle-knob{
  width:16px;height:16px;border-radius:50%;
  background:#fff;position:absolute;top:2px;left:2px;
  transition:left .2s;
}
.toggle-switch.on .toggle-knob{left:20px}
.toggle-label{font-size:13px;color:rgba(255,255,255,0.7)}
.toggle-label b{color:#4ade80}
.autopay-hint{font-size:12px;color:rgba(255,255,255,0.35);margin-left:auto}

.container{max-width:1100px;margin:0 auto;padding:24px}

/* Plan card */
.plan-card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;margin-bottom:24px;overflow:hidden;
}
.plan-card:hover{border-color:rgba(255,255,255,0.14)}
.plan-card.collapsed .plan-accordion-body{display:none}
.plan-card.collapsed .accordion-chevron{transform:rotate(-90deg)}

.plan-card-header{
  padding:20px 24px 16px;
  display:flex;align-items:flex-start;justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,0.07);
  cursor:pointer;
  gap:16px;
}
.plan-card.collapsed .plan-card-header{border-bottom:none}
.plan-heading{display:flex;align-items:flex-start;gap:12px;min-width:0}
.accordion-chevron{
  width:28px;height:28px;border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.08);
  color:#fff;font-size:17px;font-weight:900;
  transition:transform .18s ease,background .18s ease;
  flex:0 0 auto;margin-top:2px;
}
.plan-card-header:hover .accordion-chevron{background:rgba(255,255,255,0.14)}
.plan-title-wrap{min-width:0}
.plan-accordion-body{display:block}
.plan-name{font-size:20px;font-weight:800;color:#f1f5f9;margin-bottom:4px}
.plan-sub{font-size:13px;color:#38bdf8;font-weight:500}
.plan-desc{font-size:12px;color:rgba(255,255,255,0.45);margin-top:4px}

.plan-badges{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;
}
.badge-green{background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.3)}
.badge-blue{background:rgba(56,189,248,0.15);color:#38bdf8;border:1px solid rgba(56,189,248,0.3)}
.badge-purple{background:rgba(167,139,250,0.15);color:#a78bfa;border:1px solid rgba(167,139,250,0.3)}
.badge-amber{background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.3)}
.badge-red{background:rgba(248,113,113,0.15);color:#f87171;border:1px solid rgba(248,113,113,0.3)}

/* Lineas table */
.lineas-table{width:100%;border-collapse:collapse;font-size:13px}
.lineas-table th{
  text-align:left;padding:10px 16px;
  color:rgba(255,255,255,0.5);font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;
  background:rgba(0,0,0,0.15);
}
.lineas-table td{
  padding:11px 16px;
  border-bottom:1px solid rgba(255,255,255,0.04);
  vertical-align:middle;
}
.lineas-table tr:last-child td{border-bottom:none}
.lineas-table tr:hover td{background:rgba(255,255,255,0.03)}
.table-wrap{width:100%;overflow-x:auto}

.linea-num{font-weight:700;color:rgba(255,255,255,0.5);font-size:12px}
.linea-codigo{font-family:monospace;font-size:11px;background:rgba(56,189,248,0.1);color:#7dd3fc;padding:2px 7px;border-radius:4px}
.linea-precio{font-weight:700;font-size:15px;color:#fff}
.linea-total{font-weight:700;color:#4ade80}
.linea-total-ap{font-weight:700;color:#22d3ee}
.linea-savings{font-size:11px;color:rgba(74,222,128,0.7)}

/* Official activation table */
.terms-button{
  border:1px solid rgba(255,255,255,0.18);

}
.terms-button:hover{background:rgba(255,255,255,0.14)}
.activation-table{width:100%;border-collapse:collapse;background:#171b2f;color:#e2e8f0;font-size:12px}
.activation-table th,.activation-table td{border:1px solid rgba(148,163,184,0.28);padding:7px 8px;text-align:center;vertical-align:middle}
.activation-table .activation-title{background:#12304f;color:#f6c453;font-size:18px;letter-spacing:.02em;text-transform:uppercase;padding:10px}
.activation-table .activation-head{background:#232944;color:#f6c453;font-weight:800}
.activation-table .account-cell{background:#1b213a;text-align:left;min-width:178px;color:#e2e8f0}
.activation-table .account-cell ul{padding-left:20px;line-height:1.85}
.activation-table .line-count{font-weight:900;white-space:nowrap}
.activation-table .code-cell{font-weight:900;color:#7dd3fc;white-space:nowrap}
.activation-table .money-cell{font-weight:900;color:#f8fafc;white-space:nowrap}

.individual-plan-table{font-size:11px;color:#a8b3c4}
.individual-plan-table th{font-size:10px;color:#f6c453}
.individual-plan-table td{color:#a8b3c4;padding:6px 8px}
.individual-plan-name{color:#a8b3c4;font-weight:600;line-height:1.35;text-align:left}
.individual-plan-code{font-family:monospace;font-size:11px;color:#7dd3fc;background:rgba(56,189,248,0.1);display:inline-flex;margin-top:4px;padding:2px 7px;border-radius:4px}
.individual-details-button{border:1px solid rgba(56,189,248,0.32);background:rgba(56,189,248,0.1);color:#bae6fd;border-radius:7px;padding:5px 8px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}

/* Terms modal */
.modal-backdrop{

  display:none;align-items:center;justify-content:center;

.modal-backdrop.show{display:flex}
.terms-modal{

.terms-modal-header{

.terms-modal-title{font-size:15px;font-weight:900;text-transform:uppercase}
.terms-close{background:rgba(255,255,255,0.16);border:0;color:#fff;border-radius:8px;width:34px;height:34px;font-size:20px;cursor:pointer}
.terms-modal-body{padding:18px 20px;color:#e2e8f0}

.terms-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}

/* Coverage chips */
.coverage-section{padding:14px 24px;background:rgba(0,0,0,0.1)}
.coverage-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,0.4);margin-bottom:8px}
.coverage-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:3px 10px;color:rgba(255,255,255,0.6)}

.plan-footer{padding:10px 24px;background:rgba(0,0,0,0.08);font-size:11px;color:rgba(255,255,255,0.35)}

.summary-section{display:none!important}
.published-structure-title{padding:10px 0 8px;color:#38bdf8;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.business-plus-section{margin:0 0 24px;padding:16px;background:rgba(56,189,248,0.06);border:1px solid rgba(56,189,248,0.25);border-radius:12px}
.business-plus-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.business-plus-title{color:#f6c453;font-size:18px;font-weight:900;margin-bottom:6px}
.business-plus-note{color:rgba(255,255,255,0.68);font-size:12px;line-height:1.55;margin-bottom:12px}
.business-plus-terms{border:1px solid rgba(56,189,248,0.32);border-radius:8px;background:rgba(15,23,42,0.45);min-width:190px}
.business-plus-terms summary{cursor:pointer;list-style:none;padding:8px 10px;color:#bae6fd;font-size:12px;font-weight:800}
.business-plus-terms summary::-webkit-details-marker{display:none}
.business-plus-terms summary::after{content:'+';float:right;color:#f6c453;font-size:16px;line-height:12px}
.business-plus-terms[open] summary::after{content:'-'}
.business-plus-terms-content{padding:0 10px 10px;color:rgba(255,255,255,0.72);font-size:11px;line-height:1.55}
.business-plus-terms-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.business-plus-condition{white-space:pre-line;padding-top:8px;border-top:1px solid rgba(148,163,184,0.18)}
.business-plus-source{white-space:pre-line;padding-top:8px}
.business-plus-table{width:100%;min-width:1080px;border-collapse:collapse;font-size:12px}
.business-plus-table th,.business-plus-table td{border:1px solid rgba(148,163,184,0.28);padding:8px;text-align:center;vertical-align:top}
.business-plus-table th{background:#232944;color:#f6c453;font-size:11px}
.business-plus-table td{color:#e2e8f0}
.business-plus-table .equipment-list{text-align:left;min-width:220px;line-height:1.55}
.business-plus-table .regular-price{color:#f8fafc;font-weight:800;white-space:nowrap}
.business-plus-table .free{color:#4ade80;font-weight:900}
.business-plus-table .discount{color:#38bdf8;font-weight:900}
.business-plus-table .regular{color:#fbbf24;font-weight:800}
.business-plus-meta{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.business-plus-pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.25);color:#bae6fd;font-size:11px}

.state-card{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.4)}
.state-icon{font-size:48px;margin-bottom:12px}
.state-title{font-size:16px;font-weight:600;margin-bottom:6px;color:rgba(255,255,255,0.6)}

@media(max-width:640px){
  .header{flex-wrap:wrap}
  .header-search{width:100%}
  .header-search input{width:100%}
  .container{padding:12px}
  #mainContainer{padding:8px 0}
  .business-plus-section{margin:0 0 16px;padding:10px 8px;border-radius:8px}
  .business-plus-title-row{align-items:flex-start;flex-direction:column}
  .business-plus-terms{width:100%}
  .business-plus-table th,.business-plus-table td{padding:7px 6px}
  .plan-card-header{flex-direction:column;gap:12px}
  .plan-heading{width:100%}
  .lineas-table{font-size:12px}
  .lineas-table th,.lineas-table td{padding:8px 10px}
}

@media(min-width:1200px){
  .business-plus-section{
    width:calc(100vw - 64px);
    margin-left:calc((1100px - 100vw + 64px)/2 - 24px);
  }
}
</style>

<body>

<script>
const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? window.location.origin
  : 'https://crmp.ss-group.cloud';
let allModulos = [];
let publishedOffers = [];
let businessRedPlus = null;
let autopayOn = false;
let openPlanKey = null;
let openPublishedOfferId = null;
let mobileVersionMeta = null;
let basePublicationMeta = null;
let mobileOffersError = null;

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function moneyPair(regular, autopay) {
  return `${escapeHTML(regular)}<span class="autopay-red">/${escapeHTML(autopay)}</span>`;
}

function moneyNumber(value) {
  return Number(String(value || '').replace(/[^0-9.]/g, '')) || 0;
}

async function loadPlanes() {
  try {
    const modulesResponse = await fetch(`${API_BASE}/api/planes-modulos/moviles`);
    if (!modulesResponse.ok) throw new Error(`HTTP ${modulesResponse.status}`);
    const modulesData = await modulesResponse.json();
    allModulos = modulesData.modulos || [];
    basePublicationMeta = modulesData.publicacion || null;
    if (!openPlanKey && allModulos.length) openPlanKey = allModulos[0].seccion_key;
    await loadMobileOffersVersion();
    renderMobileSourceBadges();
    render();
  } catch(e) {
    document.getElementById('mainContainer').innerHTML = `
      <div class="state-card">
        <div class="state-icon">š ï¸</div>
        <div class="state-title">Error al cargar</div>
        <div class="state-sub">${e.message}</div>
      </div>`;
  }
}

async function loadMobileOffersVersion() {
  try {
    const r = await fetch(`${API_BASE}/api/ofertas-movil/vigente`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    mobileVersionMeta = data.version || null;
    mobileOffersError = null;
    publishedOffers = Array.isArray(mobileVersionMeta?.datos) ? mobileVersionMeta.datos : [];
    businessRedPlus = mobileVersionMeta?.business_red_plus || null;
  } catch (error) {
    mobileVersionMeta = null;
    mobileOffersError = error;
  }
  renderMobileSourceBadges();
}

function renderMobileSourceBadges() {
  const badge = document.getElementById('mobileSourceBadge');
  if (!badge) return;
  const badges = [];
  if (basePublicationMeta) {
    const version = basePublicationMeta.version_etiqueta || basePublicationMeta.version || '';
    const fechaBase = String(basePublicationMeta.fecha_actualizacion_base || '').slice(0, 10) || 'sin fecha';
    badges.push(`<div class="badge badge-blue" style="display:inline-flex;margin:0 8px 8px 0">Base movil vigente${version ? ` · Version ${escapeHTML(version)}` : ''} · Actualizada ${escapeHTML(fechaBase)}</div>`);
  } else {
    badges.push('<div class="badge badge-amber" style="display:inline-flex;margin:0 8px 8px 0">Base movil no disponible</div>');
  }
  if (mobileVersionMeta) {
    const expired = mobileVersionMeta.estado_vigencia === 'vencida_pendiente_reemplazo';
    badges.push(`<div class="badge ${expired ? 'badge-amber' : 'badge-green'}" style="display:inline-flex;margin:0 8px 8px 0">${expired ? 'Ofertas moviles vencidas, esperando reemplazo' : 'Ofertas moviles vigentes'} · Version ${escapeHTML(mobileVersionMeta.numero)} · ${escapeHTML(mobileVersionMeta.archivo_nombre || '')}</div>`);
  } else {
    badges.push('<div class="badge badge-amber" style="display:inline-flex;margin:0 8px 8px 0">Ofertas moviles no disponibles</div>');
  }
  badge.innerHTML = badges.join('');
}

function formatDiscount(value) {
  const number = Number(value);
  if (number === 1) return '<span class="free">Gratis</span>';
  if (number === 0) return '<span class="regular">Precio regular</span>';
  return `<span class="discount">${escapeHTML(`${Math.round(number * 100)}%`)}</span>`;
}

function renderBusinessRedPlus(container) {
  const block = businessRedPlus;
  if (!block || block.line_order_dependent !== true || !Array.isArray(block.groups) || !block.groups.length) return;
  const rows = block.groups.flatMap((group) => {
    const equipment = (group.equipment || []).map((item) => `<div>${escapeHTML(item.model)} <span class="regular-price">($${Number(item.regular_price).toFixed(2)})</span></div>`).join('');
    const discounts = (group.line_discounts || []).map((value) => `<td>${formatDiscount(value)}</td>`).join('');
    return `<tr><td class="equipment-list">${equipment}</td>${discounts}<td>${escapeHTML(String(group.max_discounted_lines ?? ''))}</td><td class="regular-price">${escapeHTML((group.equipment || []).map((item) => `$${Number(item.regular_price).toFixed(2)}`).join(' / '))}</td><td><span class="business-plus-pill">${escapeHTML(group.price_codes?.up || '-')}</span><br><span class="business-plus-pill">${escapeHTML(group.price_codes?.fi || '-')}</span></td></tr>`;
  }).join('');
  const first = block.groups[0] || {};
  const codes = [...new Set(block.groups.flatMap((group) => [group.price_codes?.up, group.price_codes?.fi].filter(Boolean)))];
  const sourceNames = (block.fuentes || []).map((source) => source.nombre_original).filter(Boolean);
  const conditions = [...new Set(block.groups.map((group) => group.terms).filter(Boolean))];
  const section = document.createElement('section');
  section.className = 'business-plus-section';
  section.id = 'business_red_plus';

function calcLineas(lineas, apDescuento, showAP) {
  let cum = 0;
  return lineas.map(l => {
    cum += l.precio;
    const precioAP = Math.max(0, l.precio - apDescuento);
    const cumAP = cum - (apDescuento * lineas.indexOf(l) ) - apDescuento;
    // Recalculate cumulative with AutoPay
    return { ...l, cumSin: cum, cumCon: null }; // Will recalculate below
  });
}

function buildCumulatives(lineas, apDesc) {
  let cumSin = 0, cumCon = 0;
  return lineas.map(l => {
    cumSin += l.precio;
    cumCon += Math.max(0, l.precio - apDesc);
    return { ...l, cumSin, cumCon };
  });
}

  const container = document.getElementById('mainContainer');

  let visible = allModulos.filter(m => !isLegacyBusinessRedModule(m));
  if (q) {
    visible = visible.filter(m =>
      m.titulo.toLowerCase().includes(q) ||
      m.subtitulo?.toLowerCase().includes(q) ||
      (m.contenido?.lineas || []).some(l => String(l.codigo || '').toLowerCase().includes(q)) ||
      (m.contenido?.filas || []).some(row => [
        row.codigo,
        row.descripcion,
        row.familia,
        row.precio_regular_descripcion,
        row.modelo_cobro,

function isBaseMobileModule(module) {

function isLegacyBusinessRedModule(module) {
  return /^business_red_(plus|extreme|supreme|sin_fronteras)$/.test(String(module?.seccion_key || ''));
}

function isPublicMobileRow(row) {
  const operationalLineOneCodes = new Set(['BREDP1', 'BREDE1', 'BREDS1', 'BREDSF1']);
  if (row?.segmento_no_incluido === 'gobierno') return false;
  if (operationalLineOneCodes.has(String(row?.codigo || '').trim())) return false;
  return true;
}

function mobileRows(module) {
  return (module?.contenido?.filas || []).filter(isPublicMobileRow);
}

function businessRedActivationRowsFromText(module) {
  const text = mobileRows(module).map(row => row.texto_original || '').find(Boolean) || '';
  if (!text) return { rows: [], accountTypes: [] };

  const accountTypes = [];
  const accountTypeRegex = /Business\s+(?:Wireline\s+Small|Regular|Corporate|Credit\s+L[ií]mit|BYOP\s+Corporate|BYOP\s+DBA)/gi;
  let accountMatch;
  while ((accountMatch = accountTypeRegex.exec(text)) !== null) {
    const value = accountMatch[0].replace(/\s+/g, ' ').trim();
    if (!accountTypes.some(item => item.toLowerCase() === value.toLowerCase())) accountTypes.push(value);
  }

  const rows = [];
  const seen = new Set();
  const rowRegex = /(\d+)\s+l[ií]nea[s]?\s+([A-Z0-9]+)\s+\$([0-9]+(?:\.[0-9]+)?)\s+([A-Z0-9]+)\s+\$([0-9]+(?:\.[0-9]+)?)\s+\$([0-9]+(?:\.[0-9]+)?)\/\$([0-9]+(?:\.[0-9]+)?)\s+\$([0-9]+(?:\.[0-9]+)?)\/\$([0-9]+(?:\.[0-9]+)?)/gi;
  let rowMatch;
  while ((rowMatch = rowRegex.exec(text)) !== null) {
    const lineNumber = Number(rowMatch[1]);
    if (!lineNumber || seen.has(lineNumber)) continue;
    seen.add(lineNumber);
    rows.push({
      lineNumber,
      lineas: `${lineNumber} linea${lineNumber === 1 ? '' : 's'}`,
      codigo_vendedor: rowMatch[2],
      precio_vendedor: `$${rowMatch[3]}`,
      codigo_sistema: rowMatch[4],
      precio_factura_linea: `$${rowMatch[5]}`,
      promedio_regular: `$${rowMatch[6]}`,
      promedio_autopay: `$${rowMatch[7]}`,
      total_regular: `$${rowMatch[8]}`,
      total_autopay: `$${rowMatch[9]}`,
    });
  }

  rows.sort((a, b) => a.lineNumber - b.lineNumber);
  return { rows, accountTypes };
}

function mobileBusinessRedFamilyOrder(family) {
  const value = String(family || '');
  if (/PLUS/i.test(value)) return 10;
  if (/EXTREME/i.test(value)) return 20;
  if (/SUPREME/i.test(value)) return 30;
  if (/SIN\s*FRONTERAS/i.test(value)) return 40;
  return 90;
}

function mobileBusinessRedKey(family) {
  const value = String(family || '');
  if (/PLUS/i.test(value)) return 'movil_multilinea_business_red_plus';
  if (/EXTREME/i.test(value)) return 'movil_multilinea_business_red_extreme';
  if (/SUPREME/i.test(value)) return 'movil_multilinea_business_red_supreme';
  if (/SIN\s*FRONTERAS/i.test(value)) return 'movil_multilinea_business_red_sin_fronteras';
  return 'movil_multilinea_business_red_otras';
}

function mobileBusinessRedFamilyLabel(family) {
  const key = mobileBusinessRedKey(family);
  if (key === 'movil_multilinea_business_red_plus') return 'Business Red PLUS';
  if (key === 'movil_multilinea_business_red_extreme') return 'Business Red EXTREME';
  if (key === 'movil_multilinea_business_red_supreme') return 'Business Red SUPREME';
  if (key === 'movil_multilinea_business_red_sin_fronteras') return 'Business Red Sin Fronteras';
  return String(family || 'Business Red');
}

function buildMobileDisplayModules(modules) {
  return (modules || []).flatMap(module => {
    if (module?.seccion_key !== 'movil_multilinea_business_red') return [module];
    const groups = new Map();
    mobileRows(module).forEach(row => {
      const family = row.familia || 'Business Red';
      if (!groups.has(family)) groups.set(family, []);
      groups.get(family).push(row);
    });
    return [...groups.entries()]
      .sort((a, b) => mobileBusinessRedFamilyOrder(a[0]) - mobileBusinessRedFamilyOrder(b[0]))
      .map(([family, rows]) => ({
        ...module,
        seccion_key: mobileBusinessRedKey(family),
        titulo: mobileBusinessRedFamilyLabel(family),
        subtitulo: 'Business RED multilinea',
        descripcion: 'Opciones publicadas por cantidad de lineas.',
        contenido: {
          ...(module.contenido || {}),
          filas: rows,
          total_filas: rows.length,
        },
      }));
  });
}

function moveIndividualPlansLast(modules) {
  const list = modules || [];
  const regularModules = list.filter(module => module?.seccion_key !== 'movil_planes_individuales');
  const individualModules = list.filter(module => module?.seccion_key === 'movil_planes_individuales');
  return [...regularModules, ...individualModules];
}

function formatPlanPrice(row) {
  if (row.precio_regular_descripcion) return row.precio_regular_descripcion;
  const value = row.precio_regular ?? row.precio;
  if (value === null || value === undefined || value === '') return '-';
  const number = Number(value);
  if (Number.isFinite(number)) return `$${number.toFixed(2)}`;
  return String(value);
}

function formatList(values) {
  const list = Array.isArray(values) ? values : [];
  return list.length ? list.map(escapeHTML).join(', ') : '-';

function lineCountLabel(row) {

  return `<div class="published-structure-title">${escapeHTML(rows.length)} planes individuales de ${escapeHTML(total)} registros auditados</div>
    <div class="table-wrap"><table class="activation-table individual-plan-table">
      <thead><tr><th>Plan / codigo</th><th>Precio</th><th>Lineas</th><th>Requisitos</th><th>Detalle</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table></div>`;
}

function buildBusinessRedBaseActivationTable(module) {
  const parsed = businessRedActivationRowsFromText(module);
  if (!parsed.rows.length) return '';
  return buildActivationTable({
    formato: 'business_red_base',
    titulo_proceso: `PROCESO DE ACTIVACION ${module.titulo || 'Business Red'}`,
    account_types: parsed.accountTypes,
    filas: parsed.rows,
  });
}

function buildPlanCard(m) {
  const c = m.contenido || {};
  const lineas = c.lineas || [];
  const apDesc = c.autopay_descuento || 10;
  const calc = buildCumulatives(lineas, apDesc);

  const hotspot = c.hotspot || '';
  const disp = (c.disponible || []).join(' · ');
  const dispositivos = (c.dispositivos || []).join(', ');
  const cobertura = c.cobertura || [];
  const nota = c.nota || '';

  // Badge color based on plan name
  const nameL = m.titulo.toLowerCase();
  const cardAccent = nameL.includes('sin fronteras') ? '#a78bfa' :
                     nameL.includes('supreme') ? '#f59e0b' :
                     nameL.includes('extreme') ? '#f87171' : '#38bdf8';

  const card = document.createElement('div');
  const isOpen = openPlanKey === m.seccion_key;
  card.className = `plan-card ${isOpen ? 'expanded' : 'collapsed'}`;
  card.style.borderColor = `${cardAccent}30`;

  // Header
  const headerHTML = `
    <div class="plan-card-header" onclick="togglePlanAccordion('${escapeHTML(m.seccion_key)}')" role="button" tabindex="0" aria-expanded="${isOpen ? 'true' : 'false'}">
      <div class="plan-heading">
        <span class="accordion-chevron">–¾</span>
        <div class="plan-title-wrap">
          <div class="plan-name" style="color:${cardAccent}">${m.titulo}</div>
          ${m.subtitulo ? `<div class="plan-sub">${m.subtitulo}</div>` : ''}
          ${m.descripcion ? `<div class="plan-desc">${m.descripcion}</div>` : ''}
        </div>
      </div>
      <div class="plan-badges">
        ${hotspot ? `<span class="badge badge-blue">ðŸ“¶ ${hotspot}</span>` : ''}
        ${disp ? `<span class="badge badge-green">œ“ ${disp}</span>` : ''}
        ${cobertura.length ? `<span class="badge badge-purple">ðŸŒŽ ${cobertura.length} Pa­ses</span>` : ''}
        ${dispositivos ? `<span class="badge badge-amber">ðŸ“± ${dispositivos}</span>` : ''}
        ${c.activacion ? `<button class="terms-button" type="button" onclick="event.stopPropagation(); openTermsModal('${escapeHTML(m.seccion_key)}')">Terminos y condiciones</button>` : ''}
      </div>
    </div>`;

  // Table
  const apHeader = autopayOn
    ? `<th>Precio/L­nea</th><th>Precio c/AutoPay</th><th>Total sin AP</th><th>Total con AP</th>`
    : `<th>Precio/L­nea</th><th>Total sin AutoPay</th>`;

  const rows = calc.map(l => {
    const precioAP = Math.max(0, l.precio - apDesc);
    if (autopayOn) {
      return `<tr>
        <td><span class="linea-num">L${l.linea}</span></td>
        <td><span class="linea-codigo">${l.codigo}</span></td>
        <td><span class="linea-precio">$${l.precio}</span></td>
        <td><span class="linea-precio" style="color:#22d3ee">$${precioAP}</span></td>
        <td><span class="linea-total">$${l.cumSin.toFixed(0)}</span></td>
        <td><span class="linea-total-ap">$${l.cumCon.toFixed(0)}</span>
          <span class="linea-savings"> (-$${(l.cumSin-l.cumCon).toFixed(0)})</span></td>
      </tr>`;
    } else {
      return `<tr>
        <td><span class="linea-num">L${l.linea}</span></td>
        <td><span class="linea-codigo">${l.codigo}</span></td>
        <td><span class="linea-precio">$${l.precio}</span></td>
        <td><span class="linea-total">$${l.cumSin.toFixed(0)}</span></td>
      </tr>`;
    }
  }).join('');

  const legacyTableHTML = `
    <div class="table-wrap"><table class="lineas-table">
      <thead><tr>
        <th>L­nea</th><th>C³digo</th>
        ${apHeader}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;

  const tableHTML = isBaseMobileModule(m)
    ? buildBaseMobileTable(m)
    : c.activacion
    ? buildActivationTable(c.activacion)
    : buildMultilineaActivationTable(m)
    || legacyTableHTML;

  // Coverage
  const coverageHTML = cobertura.length ? `
    <div class="coverage-section">
      <div class="coverage-title">ðŸŒŽ Cobertura</div>
      <div class="coverage-chips">
        ${cobertura.map(p => `<span class="chip">${p}</span>`).join('')}
      </div>
    </div>` : '';

  const footerHTML = nota ? `<div class="plan-footer">„¹ï¸ ${nota}</div>` : '';

  card.innerHTML = headerHTML + `<div class="plan-accordion-body">${tableHTML + coverageHTML + footerHTML}</div>`;
  card.querySelector('.plan-card-header')?.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      togglePlanAccordion(m.seccion_key);
    }
  });
  card.querySelectorAll('.individual-details-button').forEach(button => {
    button.addEventListener('click', event => {
      event.stopPropagation();
      openIndividualPlanDetails(button.dataset.planCode);
    });
  });
  return card;
}

function openIndividualPlanDetails(planCode) {
  const row = mobileRows(allModulos.find(m => m.seccion_key === 'movil_planes_individuales')).find(item => String(item.codigo || '') === String(planCode || ''));
  if (!row) return;
  const features = Array.isArray(row.caracteristicas_permanentes) ? row.caracteristicas_permanentes : [];
  document.getElementById('termsTitle').textContent = row.descripcion || 'Caracteristicas del plan';
  document.getElementById('termsBody').innerHTML = `
    <div class="terms-meta">
      <span class="terms-pill">Codigo: ${escapeHTML(row.codigo)}</span>
      <span class="terms-pill">Precio: ${escapeHTML(formatPlanPrice(row))}</span>
    </div>
    ${features.length ? `<ul>${features.map(item => `<li>${escapeHTML(item)}</li>`).join('')}</ul>` : '<p>No hay caracteristicas publicadas para este plan.</p>'}`;
  document.getElementById('termsBackdrop').classList.add('show');
}

function openTermsModal(seccionKey) {
  const modulo = allModulos.find(m => m.seccion_key === seccionKey);
  const activacion = modulo?.contenido?.activacion;
  if (!activacion) return;

  const terms = activacion.terminos || [];
  const isIndividualList = activacion.formato === 'individual_list' || activacion.formato === 'individual';
  const metaHTML = isIndividualList
    ? `<span class="terms-pill">Planes individuales: ${(activacion.filas || []).length}</span>`
    : `${activacion.codigo_individual ? `<span class="terms-pill">Individual: ${escapeHTML(activacion.codigo_individual)} ${escapeHTML(activacion.precio_individual || '')}</span>` : ''}
      <span class="terms-pill">Maximo 10 lineas por BAN</span>
      <span class="terms-pill">AutoPay: -$10 por linea</span>`;
  document.getElementById('termsTitle').textContent = activacion.titulo_proceso || 'Terminos y condiciones';
  document.getElementById('termsBody').innerHTML = `
    <div class="terms-meta">
      ${metaHTML}
    </div>
    <ul>${terms.map(t => `<li>${escapeHTML(t)}</li>`).join('')}</ul>`;
  document.getElementById('termsBackdrop').classList.add('show');
}

function closeTermsModal() {
  document.getElementById('termsBackdrop').classList.remove('show');
}

function backdropClose(event) {
  if (event.target?.id === 'termsBackdrop') closeTermsModal();
}

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closeTermsModal();
});

document.getElementById('searchInput').addEventListener('input', () => {
  render();
});

loadPlanes();
</script>
</body>
</html>
