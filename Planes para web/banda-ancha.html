/* ”€”€ Modal helpers ”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€ */
function openModal(titulo, items) {
  document.getElementById('modalTitulo').textContent = titulo;
  const body = document.getElementById('modalBody');
  body.innerHTML = items.map((txt, i) => `
    <div class="modal-item">
      <div class="modal-num">${i+1}</div>
      <div>${txt}</div>
    </div>`).join('');
  document.getElementById('modalOverlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function openModalHtml(titulo, html) {
  document.getElementById('modalTitulo').textContent = titulo;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function openModalIdx(idx) {
  const d = _modals[idx];
  if (!d) return;
  if (d.html !== undefined) openModalHtml(d.titulo, d.html);
  else openModal(d.titulo, d.items);
}

function buildGuiaHtml(secciones) {
  return secciones.map(s => {
    const num = s.num != null ? `<span class="guia-num">${s.num}</span>` : '';
    const intro = s.intro ? `<p class="guia-intro">${s.intro}</p>` : '';
    const puntos = (s.puntos || []).length
      ? `<ul class="guia-puntos">${s.puntos.map(p => `<li>${p}</li>`).join('')}</ul>`
      : '';
    const cierre = s.cierre ? `<p class="guia-cierre">${s.cierre}</p>` : '';
    const cita = s.cita ? `<blockquote class="guia-cita">${s.cita}</blockquote>` : '';
    return `<div class="guia-section">
      <div class="guia-titulo">${num}${s.titulo}</div>
      ${intro}${puntos}${cierre}${cita}
    </div>`;
  }).join('');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function render() {
  _modals = [];
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const container = document.getElementById('mainContainer');
  container.innerHTML = '';

  let visible = allModulos.filter(m =>
    !q ||
    m.titulo.toLowerCase().includes(q) ||
    m.subtitulo?.toLowerCase().includes(q) ||
    JSON.stringify(m.contenido).toLowerCase().includes(q)
  );

  if (!visible.length) {
    container.innerHTML = `<div class="state-card"><div class="state-icon">?</div>
      <div class="state-title">Sin resultados</div></div>`;
    return;
  }

  if (!visible.some(m => m.seccion_key === openSectionKey)) openSectionKey = visible[0]?.seccion_key || null;
  visible.forEach(m => {
    const card = buildCard(m);
    if (card) container.appendChild(card);
  });
}

function toggleInalambricoAccordion(seccionKey) {
  openSectionKey = openSectionKey === seccionKey ? null : seccionKey;
  render();
}

function formatVigenciaVisible(valor) {
  if (!valor) return '';
  const fecha = new Date(`${String(valor).slice(0, 10)}T12:00:00`);
  return Number.isNaN(fecha.getTime()) ? String(valor).slice(0, 10) : fecha.toLocaleDateString('es-PR', { day: 'numeric', month: 'long', year: 'numeric' });
}

function buildCard(m) {
  const tipo = m.tipo;
  const c = m.contenido || {};

  const card = document.createElement('div');
  const isOpen = openSectionKey === m.seccion_key;
  card.className = `section-card ${isOpen ? 'expanded' : 'collapsed'}`;

  // Vigencia badge
  let vigBadge = '';
  if (m.vigencia_desde || m.vigencia_hasta) {
    const hasta = formatVigenciaVisible(m.vigencia_hasta);
    const desde = formatVigenciaVisible(m.vigencia_desde);
    const texto = hasta ? `Vigente hasta ${hasta}` : `Vigente desde ${desde}`;
    vigBadge = `<span class="badge badge-vigencia">${texto}</span>`;
  }

  const modalBtns = [];

  if (c.guia && c.guia.length) {
    const idx = _modals.length;
    _modals.push({ titulo: 'Para quien es ' + m.titulo, html: buildGuiaHtml(c.guia) });
    modalBtns.push(`<button class="btn-modal btn-modal-green" onclick="event.stopPropagation();openModalIdx(${idx})">Leer mas</button>`);
  }

  if (m.seccion_key === 'internet_on_the_go') {
    const idxLte = _modals.length;
    _modals.push({ titulo: 'T&Cs - Banda Ancha LTE', items: c.terminos_lte || TCS_LTE });
    modalBtns.push(`<button class="btn-modal" onclick="event.stopPropagation();openModalIdx(${idxLte})">T&Cs LTE</button>`);

    const idxBk = _modals.length;
    _modals.push({ titulo: 'T&Cs - Backup Fijo / Cloud', items: c.terminos_backup || TCS_BACKUP });
    modalBtns.push(`<button class="btn-modal" onclick="event.stopPropagation();openModalIdx(${idxBk})">T&Cs Backup</button>`);
  } else if (c.terminos && c.terminos.length) {
    const idx = _modals.length;
    _modals.push({ titulo: 'Terminos y Condiciones - ' + m.titulo, items: c.terminos });
    modalBtns.push(`<button class="btn-modal" onclick="event.stopPropagation();openModalIdx(${idx})">T&Cs</button>`);
  }

  const btnsHTML = modalBtns.length
    ? `<div class="section-modal-btns">${modalBtns.join('')}</div>`
    : '';

  const summaryHTML = buildSectionSummary(m);
  const headerHTML = `
    <div class="section-header" onclick="toggleInalambricoAccordion('${m.seccion_key}')" role="button" tabindex="0" aria-expanded="${isOpen ? 'true' : 'false'}">
      <span class="section-chevron">v</span>
      <div class="section-title-wrap">
        <div class="section-name">${m.titulo}</div>
        ${m.subtitulo ? `<div class="section-sub">${m.subtitulo}</div>` : ''}
        ${m.descripcion ? `<div class="section-desc">${m.descripcion}</div>` : ''}
        ${summaryHTML}
        <div class="section-meta">
          ${vigBadge}
          ${m.boletin_ref ? `<span class="badge badge-blue">Boletin</span>` : ''}
          ${btnsHTML}
        </div>
      </div>
    </div>`;

  let bodyHTML = '';

  if (tipo === 'inalambrico') {
    if (c.planes_solo) {
      bodyHTML += buildIntGoSection(c);
    } else if (c.planes) {
      bodyHTML += buildOficinaSection(c);
    }
  } else if (tipo === 'iot') {
    bodyHTML += buildIoTSection(c);
  } else if (tipo === 'equipos_precios') {
    bodyHTML += buildEquiposPreciosSection(c);
  }

  card.innerHTML = headerHTML + `<div class="section-body">${bodyHTML}</div>`;
  card.querySelector('.section-header')?.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      toggleInalambricoAccordion(m.seccion_key);
    }
  });
  return card;
}

function buildSectionSummary(m) {
  const c = m.contenido || {};
  const pills = [];
  if (c.planes_solo?.length) pills.push(`${c.planes_solo.length} solo`);
  if (c.planes_convergente?.length) pills.push(`${c.planes_convergente.length} convergente`);
  if (c.backup?.length) pills.push(`${c.backup.length} backup`);
  if (c.planes?.length) pills.push(`${c.planes.length} planes`);
  if (c.equipos?.length) pills.push(`${c.equipos.length} equipos`);
  if (c.adicionales?.length) pills.push(`${c.adicionales.length} adicionales`);
  if (c.secciones?.length) pills.push(`${c.secciones.length} secciones`);
  return pills.length ? `<div class="section-summary">${pills.map(item => `<span class="section-summary-pill">${item}</span>`).join('')}</div>` : '';
}

function buildIntGoSection(c) {
  const soloItems = (c.planes_solo || []).map(p => `
    <div class="plan-item">
      <div class="plan-item-datos">${p.datos}</div>
      <div class="plan-item-precio">$${p.precio}/mes</div>
      <div><span class="plan-item-codigo">${p.codigo}</span></div>
      ${p.equipo_gratis ? `<div class="plan-item-nota">${p.equipo_gratis}</div>` : ''}
    </div>`).join('');

  const convItems = (c.planes_convergente || []).map(p => `
    <div class="plan-item">
      <div class="plan-item-datos">${p.datos} <span class="doble-badge">2x datos</span></div>
      <div class="plan-item-precio">$${p.precio}/mes</div>
      <div><span class="plan-item-codigo">${p.codigo}</span></div>
      ${p.nota ? `<div class="plan-item-nota">${p.nota}</div>` : ''}
    </div>`).join('');

  const backupItems = (c.backup || []).map(p => `
    <div class="plan-item">
      <div class="plan-item-datos">${p.datos}</div>
      <div class="plan-item-precio">$${p.precio}/mes</div>
      <div><span class="plan-item-codigo">${p.codigo}</span></div>
      <div class="plan-item-nota">${p.uso}</div>
    </div>`).join('');

  const equipos = (c.equipos || []).map(e => `
    <div class="equipo-item">
      <span class="equipo-nombre">${e.nombre}</span>
      <span class="equipo-costo">${e.costo}${e.byop_precio ? ` · BYOP $${e.byop_precio}` : ''}</span>
    </div>`).join('');

  return `
    <div style="padding:16px 24px 6px">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,0.4);margin-bottom:8px">
        Planes Solo
      </div>
    </div>
    <div class="plans-grid">${soloItems}</div>

    <div style="padding:6px 24px">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,0.4);margin-bottom:8px">
        Planes Convergente (cliente Claro Fijo - doble datos)
      </div>
    </div>
    <div class="plans-grid">${convItems}</div>

    ${backupItems ? `
      <div style="padding:6px 24px">
        <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,0.4);margin-bottom:8px">
          Backup Fijo / Cloud
        </div>
      </div>
      <div class="plans-grid">${backupItems}</div>` : ''}

    ${equipos ? `<div class="equipos-section">
      <div class="equipos-title">Equipos</div>
      ${equipos}
    </div>` : ''}`;
}

function buildOficinaSection(c) {
  const planItems = (c.planes || []).map(p => `
    <div class="oficina-item">
      <div class="oficina-name">${p.nombre}</div>
      <div class="oficina-precio">$${p.precio}<span style="font-size:13px;font-weight:400;color:rgba(255,255,255,0.5)">/mes</span></div>
      <div class="oficina-autopay">$${p.precio_autopago}/mes con AutoPago</div>
      <ul class="oficina-features">
        <li>Internet ${p.internet}</li>
        <li>${p.datos} de datos</li>
        ${p.velocidad_reducida ? `<li>${p.velocidad_reducida} al agotar datos</li>` : ''}
        ${(p.incluye||[]).map(i => `<li>${i}</li>`).join('')}
      </ul>
      <span class="oficina-codigo">${p.codigo}</span>
    </div>`).join('');

  const equipos = (c.equipos || []).map(e => `
    <div class="equipo-item">
      <span class="equipo-nombre">${e.nombre}</span>
      <span class="equipo-costo">${e.costo}</span>
    </div>`).join('');

  const nota = c.nota ? `<div class="plan-footer" style="padding:10px 24px;font-size:11px;color:rgba(255,255,255,0.35)">${c.nota}</div>` : '';

  return `
    <div class="oficina-grid">${planItems}</div>
    ${equipos ? `<div class="equipos-section"><div class="equipos-title">Equipos</div>${equipos}</div>` : ''}
    ${nota}`;
}

function buildIoTSection(c) {
  const planItems = (c.planes || []).map(p => `
    <div class="iot-item">
      <div class="iot-datos">${p.datos}</div>
      <div class="iot-precio">$${p.precio}</div>
      <div class="iot-codigo">${p.codigo}</div>
    </div>`).join('');

  const notas = (c.notas || []).map(n => `<div class="nota-item">${n}</div>`).join('');

  const adicionales = (c.adicionales || []).map(a => `
    <div class="adicional-item">
      <span class="adicional-nombre">${a.nombre}</span>
      <span class="adicional-precio">${a.precio === 0 ? 'Sin costo' : '$'+a.precio}</span>
      <span class="adicional-tipo"> - ${a.tipo}</span>
    </div>`).join('');

  return `
    <div class="iot-grid">${planItems}</div>
    ${notas ? `<div class="notas-section">${notas}</div>` : ''}
    ${adicionales ? `<div class="adicionales-section">
      <div class="adicionales-title">Servicios adicionales</div>
      <div class="adicionales-list">${adicionales}</div>
    </div>` : ''}`;
}

/* ”€”€ Tabla de equipos y precios ”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€”€ */
function buildEquiposPreciosSection(c) {
  const fmt = v => (v == null || v === 0) ? '<span style="color:rgba(255,255,255,0.2)">-</span>' : `$${Number(v).toFixed(2)}`;

  const tablaSeccion = (secciones) => (secciones || []).map(sec => {
    const filas = (sec.equipos || []).map(e => `
      <tr>
        <td class="ep-modelo">${e.modelo}</td>
        <td class="ep-code">${e.item_code || ''}</td>
        <td class="ep-precio">${fmt(e.precio_regular)}</td>
        <td>${fmt(e.fin_12)}</td>
        <td>${fmt(e.fin_24)}</td>
        <td>${fmt(e.fin_30)}</td>
        <td>${fmt(e.fin_36)}</td>
      </tr>`).join('');
    return `
      <div class="ep-section-label">${sec.titulo}</div>
      <div class="ep-table-wrap">
        <table class="ep-table">
          <thead>
            <tr>
              <th class="ep-th-modelo">Modelo</th>
              <th>Item</th>
              <th>Regular</th>
              <th>12 meses</th>
              <th>24 meses</th>
              <th>30 meses</th>
              <th>36 meses</th>
            </tr>
          </thead>
          <tbody>${filas}</tbody>
        </table>
      </div>`;
  }).join('');

  const tablaFin = (rows, titulo, cols) => {
    if (!rows || !rows.length) return '';
    const filas = rows.map(e => `
      <tr>
        <td class="ep-modelo">${e.modelo}</td>
        <td class="ep-code">${e.item_code || ''}</td>
        <td class="ep-precio">${fmt(e.precio_regular)}</td>
        ${cols.includes('fin_12') ? `<td>${fmt(e.fin_12)}</td>` : ''}
        ${cols.includes('fin_24') ? `<td>${fmt(e.fin_24)}</td>` : ''}
        ${cols.includes('fin_30') ? `<td>${fmt(e.fin_30)}</td>` : ''}
        ${cols.includes('fin_36') ? `<td>${fmt(e.fin_36)}</td>` : ''}
        ${e.nota ? `<td class="ep-nota" colspan="2">${e.nota}</td>` : ''}
      </tr>`).join('');
    return `
      <div class="ep-section-label">${titulo}</div>
      <div class="ep-table-wrap">
        <table class="ep-table">
          <thead>
            <tr>
              <th class="ep-th-modelo">Modelo</th>
              <th>Item</th>
              <th>Regular</th>
              ${cols.includes('fin_12') ? '<th>12m</th>' : ''}
              ${cols.includes('fin_24') ? '<th>24m</th>' : ''}
              ${cols.includes('fin_30') ? '<th>30m</th>' : ''}
              ${cols.includes('fin_36') ? '<th>36m</th>' : ''}
            </tr>
          </thead>
          <tbody>${filas}</tbody>
        </table>
      </div>`;
  };

  const ofertas = (c.ofertas_especiales || []).map(o => `
    <div class="oferta-card">
      <div class="oferta-num">${o.num || '-'}</div>
      <div>
        <div class="oferta-modelo">${o.modelo}</div>
        ${(o.detalles || []).map(d => `<div class="oferta-detalle">- ${d}</div>`).join('')}
      </div>
    </div>`).join('');

  return `
    <div style="padding:16px 24px 4px">
      ${tablaSeccion(c.secciones)}
          ${tablaFin(c.financiamiento_of, 'Financiamiento FIOF - Oferta Convergente', ['fin_12','fin_24','fin_30','fin_36'])}
          ${tablaFin(c.financiamiento_gu, 'Financiamiento FIGU - Oferta Convergente (planes &lt;$30)', ['fin_24','fin_36'])}
    </div>
    ${ofertas ? `
      <div class="ep-ofertas-section">
        <div class="ep-ofertas-title">Ofertas Especiales Vigentes</div>
        <div class="ep-ofertas-grid">${ofertas}</div>
      </div>` : ''}`;
}

document.getElementById('searchInput').addEventListener('input', () => render());

loadPlanes();
</script>

<!-- Modal T&Cs / Guia -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal-panel">
    <div class="modal-header">
      <div class="modal-titulo" id="modalTitulo"></div>
      <button class="modal-close" onclick="closeModal()">x</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

</body>
